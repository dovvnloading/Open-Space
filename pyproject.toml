[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-space-research"
version = "0.2.0"
description = "Agent-led searches of public astronomical images, time series, astrometry and spectra"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
archive = ["astropy>=5.3"]

[project.scripts]
open-space = "open_space.__main__:main"

[tool.setuptools]
packages = ["open_space"]
