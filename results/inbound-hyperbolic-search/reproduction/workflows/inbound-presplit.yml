name: Check pre-split Evans–Drinkwater astrometry
on:
  push:
    branches: [research/inbound-hyperbolic-search]
    paths:
      - 'results/inbound-hyperbolic-search/orbits/fragment/*.py'
      - '.github/workflows/inbound-presplit.yml'
permissions:
  contents: read
  actions: read
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            results/inbound-hyperbolic-search/orbits
            results/inbound-hyperbolic-search/batch/refit.py
            results/inbound-hyperbolic-search/batch/evidence/latest_mpc_refits.json.gz
            results/inbound-hyperbolic-search/catalog/audit.py
            results/inbound-hyperbolic-search/catalog/sbdb.json.gz
            results/borisov-704021/propagate.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: mpc-observation-snapshot
          run-id: 44029645452
          github-token: ${{ github.token }}
          path: mpc-snapshot
      - run: python -m pip install numpy scipy pyerfa jplephem pymupdf
      - run: python results/inbound-hyperbolic-search/orbits/fragment/replay.py mpc-snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evans-drinkwater-presplit
          path: results/inbound-hyperbolic-search/orbits/fragment/evidence/
          retention-days: 30
