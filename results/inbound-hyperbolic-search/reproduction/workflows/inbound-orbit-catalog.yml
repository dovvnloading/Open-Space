name: Test parabolic sungrazer alternatives from the SOHO spacecraft
on:
  push:
    branches: ['research/inbound-hyperbolic-search']
    paths: ['results/inbound-hyperbolic-search/catalog/soho_models.py','.github/workflows/inbound-orbit-catalog.yml']
permissions:
  contents: read
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: results/inbound-hyperbolic-search/catalog
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/inbound-hyperbolic-search/catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 astropy==7.1.0
      - run: python soho_models.py
      - name: Report stack results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          for path in Path('soho').glob('*'):
              body = base64.b64encode(gzip.compress(path.read_bytes(), mtime=0)).decode()
              for i in range(0,len(body),4000):
                  print('SOHOFILE',path.name,i,body[i:i+4000])
          PY
