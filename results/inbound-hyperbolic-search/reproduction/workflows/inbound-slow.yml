name: Slow inbound orbit refits
on:
  push:
    branches: [research/inbound-hyperbolic-search]
    paths:
      - 'results/inbound-hyperbolic-search/orbits/slow/*.py'
      - '.github/workflows/inbound-slow.yml'
permissions:
  contents: read
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            results/inbound-hyperbolic-search/orbits
            results/borisov-704021/propagate.py
          sparse-checkout-cone-mode: false
      - run: python -m pip install numpy scipy pyerfa jplephem
      - run: python results/inbound-hyperbolic-search/orbits/slow/replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-orbit-fits
          path: results/inbound-hyperbolic-search/orbits/slow/evidence/
          retention-days: 30
