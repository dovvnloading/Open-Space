name: Inbound orbit refits
on:
  push:
    branches: [research/inbound-hyperbolic-search]
    paths:
      - 'results/inbound-hyperbolic-search/orbits/*.py'
      - '.github/workflows/inbound-orbits.yml'
permissions:
  contents: read
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
      ORBITS: results/inbound-hyperbolic-search/orbits
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            results/inbound-hyperbolic-search/orbits
            results/borisov-704021/propagate.py
          sparse-checkout-cone-mode: false
      - run: python -m pip install numpy scipy pyerfa jplephem
      - run: python "$ORBITS/acquire.py"
      - name: Fit measured sky positions and propagate inbound
        if: hashFiles('results/inbound-hyperbolic-search/orbits/refit.py') != ''
        run: python "$ORBITS/refit.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-fits
          path: results/inbound-hyperbolic-search/orbits/data/
          retention-days: 30
