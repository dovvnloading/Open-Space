name: Check dated public-source receipts and SWAN precovery context
on:
  push:
    branches: [research/inbound-hyperbolic-search]
    paths: [".github/workflows/inbound-source-referee.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Re-fetch original ITF and MPC bulk URLs, verify source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,urllib.request
          from pathlib import Path
          root=Path('results/inbound-hyperbolic-search')
          itf=json.loads((root/'tracklets/run/input.json').read_text())
          mpc=json.loads((root/'orbits/data/acquisition.json').read_text())['inputs'][0]
          for name,url,expected in [
            ('ITF',itf['url'],itf['source_sha256']),
            ('MPC_CmtObs',mpc['requested_url'],mpc['sha256'])]:
            request=urllib.request.Request(url,headers={'User-Agent':'Open-Space-referee/1.0'})
            with urllib.request.urlopen(request,timeout=120) as r:
              h=hashlib.sha256();n=0
              while True:
                chunk=r.read(1024*1024)
                if not chunk:break
                n+=len(chunk);h.update(chunk)
              actual=h.hexdigest()
              print('UPSTREAM_SHA256',name,'sha256',actual,'bytes',n,'expected',expected,'equal',actual==expected,'Last-Modified',r.headers.get('Last-Modified'),flush=True)
          PY
  refreshed_itf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Re-extract exact F51 and X05 observations from today's newer ITF release
        shell: bash
        run: |
          set -euo pipefail
          python results/inbound-hyperbolic-search/tracklets/extract.py --output "$RUNNER_TEMP/newer-itf"
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          root=Path('results/inbound-hyperbolic-search/tracklets/run')
          newer=Path(os.environ['RUNNER_TEMP'])/'newer-itf'
          old=json.loads((root/'input.json').read_text())
          fresh=json.loads((newer/'input.json').read_text())
          for key in ('ps1_all_sha256','ps1_sha256','selected_sha256','ps1_date_window_all_sky_rows','ps1_patch_rows','primary_29day_rows','source_lines','selected_bytes'):
            assert old[key]==fresh[key],(key,old[key],fresh[key])
          for f in ('f51-all.mpc','f51.mpc','x05.mpc'):
            assert (root/f).read_bytes()==(newer/f).read_bytes(),f
          print('REFEREE_ITF_REFRESH',{'original_compressed_sha256':old['source_sha256'],'new_compressed_sha256':fresh['source_sha256'],'original_last_modified':old['response_headers']['Last-Modified'],'new_last_modified':fresh['response_headers']['Last-Modified'],'same_selected_bytes':True,'F51_rows':fresh['ps1_date_window_all_sky_rows'],'Rubin_current_window':fresh['primary_29day_rows'],'source_lines':fresh['source_lines']})
          PY
  rubin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay all 29 generation-pinned Rubin MPC exports and dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request,hashlib,gzip,csv,io,collections
          from pathlib import Path
          root=Path('results/inbound-hyperbolic-search/tracklets/run')
          archive=json.loads((root/'rubin-feed.json').read_text())
          assert len(archive['retrieved'])==29
          status=collections.Counter();obsdate=collections.Counter();seen=set();duplicates=0
          for part in archive['retrieved']:
            with urllib.request.urlopen(urllib.request.Request(part['url'],headers={'User-Agent':'Open-Space-referee/1.0'}),timeout=120) as r:
              b=r.read()
            assert len(b)==part['bytes']
            assert hashlib.sha256(b).hexdigest()==part['sha256'],part['url']
            rows=list(csv.DictReader(io.StringIO(gzip.decompress(b).decode())))
            for row in rows:
              assert row['stn']=='X05'
              if row['id'] in seen:
                duplicates+=1
                continue
              seen.add(row['id']);status[row['status']]+=1;obsdate[row['obstime'][:10]]+=1
          assert len(seen)==archive['rows']==45440
          assert status==archive['by_status'] and status=={'P':59,'p':45352,'I':29}
          assert duplicates==archive['duplicate_ids']==0
          assert dict(sorted(obsdate.items()))==archive['by_observation_date']
          assert not any('2026-10-19'<=d<'2026-11-17' and n>0 for d,n in obsdate.items())
          print('REFEREE_RUBIN',{'input_parts':len(archive['retrieved']),'unique_rows':len(seen),'status_counts':dict(status),'observation_dates':[min(obsdate),max(obsdate)],'no_primary_window_observation':True})
          PY
  h6_energy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "numpy==2.5.5" "scipy==1.18.1" "pyerfa==2.0.1.5" "jplephem==2.24"
      - name: Refit C/2004 H6 gravity, water-ice recoil, and normal acceleration using frozen 307 MPC positions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys,json,gzip,hashlib,urllib.request
          from pathlib import Path
          root=Path('results/inbound-hyperbolic-search')
          path=root/'orbits/robust'
          import importlib.util
          spec=importlib.util.spec_from_file_location('referee_robust',path/'replay.py')
          replay=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=replay
          spec.loader.exec_module(replay)
          src=root/'catalog/sbdb.json.gz'
          cat=json.loads(gzip.decompress(src.read_bytes()))
          row=next(dict(zip(cat['fields'],r)) for r in cat['data'] if str(r[0])=='1000500')
          for file,url,sha in [
            ('de440.bsp','https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440.bsp','a4ce9bf9b3282becc9f4b2ac3cebe03a2ae7599981aabd7265fd8482fff7c4b5'),
            ('stations.txt','https://minorplanetcenter.net/iau/lists/ObsCodes.html','fc7a5c9e7259ef93a5b93eb4c69984980ba775803cfb93e6f8376fee81c0d45f')
          ]:
            with urllib.request.urlopen(url,timeout=120) as resp:b=resp.read()
            assert hashlib.sha256(b).hexdigest()==sha,file
            (replay.CACHE/file).write_bytes(b)
          matched=[]
          for p in sorted((path/'evidence').glob('*part-*.json.gz')):
            dataset=json.loads(gzip.decompress(p.read_bytes()))
            for record in dataset['objects']:
              if str(record['spkid'])!='1000500':continue
              matched.append((p.name,record))
          assert len(matched)==2,[(name,len(obj['selected_mpc80'])) for name,obj in matched]
          for name,original in matched:
            raw=original['selected_mpc80']
            assert len(raw)==307
            assert hashlib.sha256(('\n'.join(raw)+'\n').encode('ascii')).hexdigest()==original['selected_sha256']
            result=replay.one((original['screen'],row,raw))
            assert 'error' not in result,(name,result)
            assert result['selected_sha256']==original['selected_sha256']
            for kind,prev in original['models'].items():
              if 'boundaries' not in prev:continue
              got=result['models'].get(kind,{})
              assert 'boundaries' in got,(name,kind,got)
              p=prev['boundaries']['250au'];q=got['boundaries']['250au']
              assert abs(p['inverse_a_au_inv']-q['inverse_a_au_inv'])<0.00002,(name,kind,p,q)
              assert abs(p['formal_sigma_inverse_a']-q['formal_sigma_inverse_a'])<0.00005,(name,kind,p,q)
              z=-q['inverse_a_au_inv']/q['formal_sigma_inverse_a']
              if kind=='marsden_outward':assert abs(z-3.61)<.12,z
              if kind=='marsden_outward_3d':assert abs(z-2.69)<.12,z
              print('REFEREE_H6_ENERGY',name,kind,'used',got['used'],'inverse_a',q['inverse_a_au_inv'],'sigma',q['formal_sigma_inverse_a'],'z',z)
          PY
  swan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Re-run the published SWAN directions and two ground-orbit ephemerides
        shell: bash
        run: |
          set -euo pipefail
          python results/inbound-hyperbolic-search/catalog/h6-archive/check_swan.py --output "$RUNNER_TEMP/swan-independent.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          prior=json.loads(Path('results/inbound-hyperbolic-search/catalog/h6-archive/swan-receipts.json').read_text())
          now=json.loads((Path(os.environ['RUNNER_TEMP'])/'swan-independent.json').read_text())
          assert prior['quicklook_images']==now['quicklook_images']==9
          assert len(prior['positions'])==len(now['positions'])==4
          for p,q in zip(prior['positions'],now['positions']):
            assert p['day']==q['day']
            assert abs(p['SWAN_minus_Horizons_00UT_separation_deg']-q['SWAN_minus_Horizons_00UT_separation_deg'])<0.01
            assert abs(p['two_body_L42_vs_N33_00TDB_separation_arcsec']-q['two_body_L42_vs_N33_00TDB_separation_arcsec'])<0.1
          original={x['input']:x for x in prior['receipts']}
          same=0
          for rec in now['receipts']:
            if rec['sha256']==original[rec['input']]['sha256'] and rec['bytes']==original[rec['input']]['bytes']:
              same+=1
          print('REFEREE_SWAN_CHANGED_INPUTS',[rec['input'] for rec in now['receipts'] if rec['sha256']!=original[rec['input']]['sha256'] or rec['bytes']!=original[rec['input']]['bytes']])
          print('REFEREE_SWAN',{'dates':[x['day'] for x in now['positions']],'discovery_directions_offset_deg':[round(x['SWAN_minus_Horizons_00UT_separation_deg'],6) for x in now['positions']],'orbital_model_sep_arcsec':[round(x['two_body_L42_vs_N33_00TDB_separation_arcsec'],6) for x in now['positions']],'source_receipt_matching':same,'all_source_receipts':len(now['receipts'])})
          PY
