name: Pointing-conditioned F51 injection replay
on:
  push:
    branches: [research/inbound-hyperbolic-search]
    paths:
      - ".github/workflows/inbound-pointing.yml"
      - "results/inbound-hyperbolic-search/tracklets/pointing/replay.py"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: results/inbound-hyperbolic-search/tracklets
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test paths against archived observations on actual exposure timestamps
        working-directory: results/inbound-hyperbolic-search/tracklets
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 pyerfa==2.0.1.5
          python pointing/replay.py --data run --states 20000 --fit-cap 100
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          for f in sorted(Path("run").glob("pointing-*.json")):
              data=base64.b64encode(gzip.compress(f.read_bytes(),mtime=0)).decode()
              for i in range(0,len(data),3000):
                  print(f"PUBLIC_DATA {f.name} {i//3000} {data[i:i+3000]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f51-pointing-recovery
          path: results/inbound-hyperbolic-search/tracklets/run/pointing-*.json
          retention-days: 14
