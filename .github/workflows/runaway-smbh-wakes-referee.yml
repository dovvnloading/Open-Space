name: Runaway SMBH wake referee replay

on:
  push:
    branches:
      - research/runaway-smbh-wakes
  pull_request:
    paths:
      - "results/runaway-smbh-wakes/**"
      - ".github/workflows/runaway-smbh-wakes-referee.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deposited Python modules
        run: python -m compileall -q results/runaway-smbh-wakes
      - name: Recompute denominators, source hashes, recovery cells, catalogue and archival control
        run: python results/runaway-smbh-wakes/referee_replay.py
      - name: Synthetic line and negative-control regression
        working-directory: results/runaway-smbh-wakes/detector
        run: |
          python -m pip install numpy scipy
          OPENBLAS_NUM_THREADS=1 python test_wake.py
      - name: Check root catalogue integrity
        run: python -m open_space.verify --worktree

  windows-replay-guards:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare required external D drive temp space
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'D:\wake-temp' | Out-Null
          "TEMP=D:\wake-temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=D:\wake-temp" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Frozen cache and HATS guard tests
        run: |
          python -m pip install numpy pyarrow
          python -m unittest discover -s results/runaway-smbh-wakes -p 'test_*guard.py' -v
