name: Euclid DR1-F wide high-z quasar survey and follow-up
on:
  push:
    branches:
      - research/euclid-dr1-wide-highz-vetting
    paths:
      - 'results/euclid-dr1-wide-highz-vetting/**'
      - '!results/euclid-dr1-wide-highz-vetting/output/**'
      - '!results/euclid-dr1-wide-highz-vetting/README.md'
      - '!results/euclid-dr1-wide-highz-vetting/REFEREE.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: euclid-dr1f-wide-highz-vetting
  cancel-in-progress: false

jobs:
  data-and-computation:
    if: github.ref == 'refs/heads/research/euclid-dr1-wide-highz-vetting'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-data readers and run offline selection tests
        run: |
          python -m pip install 'requests>=2.31,<3' 'numpy>=2,<3' 'pyarrow>=20' 'astropy>=6' 'astropy-healpix>=1.1'
          python -m py_compile results/euclid-dr1-wide-highz-vetting/scan.py results/euclid-dr1-wide-highz-vetting/aggregate.py results/euclid-dr1-wide-highz-vetting/vet.py results/euclid-dr1-wide-highz-vetting/image_review.py results/euclid-dr1-wide-highz-vetting/referee.py
          python -m unittest discover -s results/euclid-dr1-wide-highz-vetting -p tests.py -v
      - name: Stream every HATS partition by row group, checkpoint and vet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src=results/euclid-dr1-wide-highz-vetting
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          started=$(date +%s)
          limit=18000

          save_batch() {
            git add "$src/output"
            if ! git diff --cached --quiet; then
              git commit -m 'research(euclid-wide): checkpoint HATS partition batch and replay'
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          }

          while [ $(( $(date +%s) - started )) -lt "$limit" ]; do
            if ! python -u "$src/scan.py"; then
              python -u "$src/aggregate.py" || true
              save_batch
              echo 'A publisher partition failed; no full-survey result can be asserted.' >&2
              exit 1
            fi
            python -u "$src/aggregate.py"
            phase=$(python -c 'import json; print(json.load(open("results/euclid-dr1-wide-highz-vetting/output/summary.json"))["status"])')
            if [[ "$phase" == SCAN_COMPLETE ]]; then
              set +e
              python -u "$src/vet.py" &&
                python -u "$src/image_review.py" &&
                python -u "$src/referee.py"
              success=$?
              set -e
              save_batch
              if [[ "$success" -ne 0 ]]; then
                echo "External followup/model stage failed with code $success." >&2
                exit "$success"
              fi
              echo 'Wide HATS index is partition complete; inspect conditional recovery and evidence receipts.'
              exit 0
            fi
            save_batch
          done
          echo 'Runtime budget reached. Completed batches are checkpointed; attempting a sequential follow-up job.'
          gh workflow run euclid-dr1-wide-highz-vetting.yml --ref "$GITHUB_REF_NAME" || {
            echo 'Automated dispatch unavailable on this branch; checkpoint is intact. Explicit new source-path push required to resume.' >&2
            exit 1
          }
      - name: Preserve receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euclid-wide-hats-network-receipts
          path: results/euclid-dr1-wide-highz-vetting/output/
          retention-days: 30
          if-no-files-found: warn
