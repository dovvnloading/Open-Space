name: Forbush-to-Dst independent archival replay
on:
  push:
    paths:
      - examples/forbush_dst_independent.py
      - tests/test_forbush_dst_independent.py
      - examples/audit_neutron_monitor_identity.py
      - tests/test_audit_neutron_monitor_identity.py
      - .github/workflows/forbush-dst-replay.yml
      - examples/verify_heliophysics_replay.py
      - tests/test_verify_heliophysics_replay.py
      - results/forbush-storm-onset/summary.json
      - results/forbush-storm-onset/neutron-monitor-identity-audit.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-dst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pyarrow>=17,<24'
      - run: python -m unittest discover -s tests -p test_forbush_dst_independent.py -v
      - run: python -m unittest discover -s tests -p test_audit_neutron_monitor_identity.py -v
      - run: python -m unittest discover -s tests -p test_verify_heliophysics_replay.py -v
      - name: Download public archives and compute independent holdout
        run: python examples/forbush_dst_independent.py --fetch --output /tmp/forbush-dst-summary.json --draws 3000
      - name: Show compact archived findings
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/forbush-dst-summary.json'))
          print('Raw FEID rows:',p['raw_feid_rows'])
          print('OMNI hourly Dst rows:',p['dst_hours'])
          for label,part in p['cohorts'].items():
              print(label, 'eligible',part['eligible_episodes'],
                    'hits',part['hits_48h'],
                    'null',part['null_year_month_matched'])
          PY
      - name: Independently audit neutron-monitor station identity provenance
        run: python examples/audit_neutron_monitor_identity.py --fetch --output /tmp/neutron-identity-audit.json
      - name: Enforce immutable source digests and both committed reference results
        run: |
          python examples/verify_heliophysics_replay.py --kind forbush --reference results/forbush-storm-onset/summary.json --observed /tmp/forbush-dst-summary.json
          python examples/verify_heliophysics_replay.py --kind neutron --reference results/forbush-storm-onset/neutron-monitor-identity-audit.json --observed /tmp/neutron-identity-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: independent-forbush-dst-results
          path: |
            /tmp/forbush-dst-summary.json
            /tmp/neutron-identity-audit.json
          if-no-files-found: error
