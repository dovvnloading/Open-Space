name: ZTF DR24 nightly photometry
on:
  push:
    branches: [research/spherex-waste-heat]
    paths: [.github/workflows/spherex-ztf-nightly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    if: github.ref == 'refs/heads/research/spherex-waste-heat'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/spherex-waste-heat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('results/spherex-waste-heat/optical/lightcurve_inputs.zip') == '' }}
        with:
          name: archive-optical
          github-token: ${{ github.token }}
          run-id: 44025746210
          path: results/spherex-waste-heat
      - name: Calculate nightly statistics for successful API queries
        working-directory: results/spherex-waste-heat/optical
        run: |
          python -m pip install numpy scipy pyarrow astropy-healpix
          python nightly.py
          cat nightly_summary.csv
      - name: Recover missing API results from archived DR24 partitions
        id: recover
        continue-on-error: true
        working-directory: results/spherex-waste-heat/optical
        run: |
          python hats_fallback.py
          python nightly.py
          cat nightly_summary.csv
      - name: Check D's two faint catalog detections on the science images
        id: pixel
        if: ${{ !contains(github.event.head_commit.message, '[warm FGK]') }}
        continue-on-error: true
        working-directory: results/spherex-waste-heat/optical
        run: python d_science.py
      - name: Compare D with its neighbors on the same exposures
        if: ${{ !contains(github.event.head_commit.message, '[warm FGK]') }}
        id: neighbors
        continue-on-error: true
        working-directory: results/spherex-waste-heat/optical
        run: python d_catalog_controls.py
      - name: Recover the three warm FGK DR24 queries
        if: ${{ contains(github.event.head_commit.message, '[warm FGK]') }}
        id: warm
        continue-on-error: true
        working-directory: results/spherex-waste-heat/warm_fgk
        run: python recover_optical.py
      - name: Record optical products
        working-directory: results/spherex-waste-heat/optical
        env:
          RECOVERY_STATUS: ${{ steps.recover.outcome }}
          PIXEL_STATUS: ${{ steps.pixel.outcome }}
          CONTROL_STATUS: ${{ steps.neighbors.outcome }}
          WARM_STATUS: ${{ steps.warm.outcome }}
        run: |
          set -euo pipefail
          git add -f nightly.csv nightly_summary.csv
          if [[ -f ../warm_fgk/recovery_receipts.json ]]; then
            git add -f ../warm_fgk/recovery_receipts.json ../warm_fgk/recovery_summary.csv
            shopt -s nullglob
            extras=(../warm_fgk/retry_*.csv.gz ../warm_fgk/hats_*.csv.gz)
            if (("${#extras[@]}")); then git add -f "${extras[@]}"; fi
          fi
          if [[ -f d_science_cutouts.zip ]]; then git add -f d_science_cutouts.zip d_science_receipts.json; fi
          if [[ -f d_catalog_control_receipt.json ]]; then git add -f d_catalog_control_receipt.json; fi
          if [[ -f d_catalog_control_input.csv.gz ]]; then git add -f d_catalog_control_input.csv.gz; fi
          if [[ -f d_catalog_controls.csv ]]; then git add -f d_catalog_controls.csv; fi
          if [[ -f d_aperture_summary.csv ]]; then git add -f d_aperture_controls.csv d_aperture_summary.csv; fi
          if [[ -f hats_receipts.json ]]; then git add -f hats_receipts.json hats_*.csv.gz; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record unique-night optical coverage and DR24 fallback inputs'
            for attempt in 1 2 3; do
              git fetch origin research/spherex-waste-heat
              git rebase --autostash FETCH_HEAD
              if git push origin HEAD:research/spherex-waste-heat; then break; fi
              if [[ "$attempt" == 3 ]]; then exit 1; fi
            done
          fi
          test "$RECOVERY_STATUS" = success
          test "$PIXEL_STATUS" != failure || test "$CONTROL_STATUS" = success
          test "$WARM_STATUS" != failure
