name: HETDEX blind rare-emitter search
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Research stage
        type: choice
        default: full
        options: [scan, vet, focus, full]
  push:
    branches: [science/hetdex-blind-emitter-search]
    paths: [.github/workflows/hetdex-blind-emitters.yml]

permissions:
  contents: read

concurrency:
  group: hetdex-rare-emitters-${{ github.ref }}-${{ (inputs.stage || 'focus') == 'focus' && 'followup' || 'search' }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[replace-hetdex-run]') }}

env:
  SURVEY: results/hetdex_blind_emitters
  STAGE: ${{ inputs.stage || 'focus' }}
  VET_RUN: "44995021247"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  research:
    if: github.ref == 'refs/heads/science/hetdex-blind-emitter-search'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ (inputs.stage || 'focus') == 'focus' && 1 || 2 }}
      matrix:
        release: [sc2, sc1]
    env:
      RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: results/hetdex_blind_emitters
      - name: Read the published scan checkpoint
        if: env.STAGE == 'vet'
        uses: actions/checkout@v4
        with:
          ref: science/hetdex-blind-emitter-search
          path: checkpoint
          persist-credentials: false
          filter: blob:none
          sparse-checkout: results/hetdex_blind_emitters/evidence
      - name: Freeze input evidence for this run
        if: env.STAGE == 'vet'
        run: |
          src="checkpoint/$SURVEY/evidence/$RELEASE"
          test -s "$src/scan-summary.json"
          mkdir -p "$SURVEY/evidence/$RELEASE"
          cp "$src"/{scan-summary.json,screen.jsonl.gz,shuffled.jsonl.gz,injections.jsonl.gz} "$SURVEY/evidence/$RELEASE/"
          git -C checkpoint rev-parse HEAD > "$SURVEY/evidence/$RELEASE/scan-checkpoint-commit.txt"
      - name: Restore completed release-level vetting before the supplement
        if: env.STAGE == 'focus'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$SURVEY/evidence/$RELEASE"
          if test -s "$out/matched-shuffle-vet/vet-summary.json" && test -s "$out/vet-summary.json"; then
            exit 0
          fi
          for attempt in $(seq 1 450); do
            names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VET_RUN/artifacts?per_page=30" --jq '.artifacts[] | select(.expired==false) | .name')
            if grep -Fxq "research-$RELEASE" <<< "$names"; then
              archive_dir=$(mktemp -d "$RUNNER_TEMP/hetdex-vet-XXXXXXXX")
              gh run download "$VET_RUN" --repo "$GITHUB_REPOSITORY" --name "research-$RELEASE" --dir "$archive_dir"
              mkdir -p "$out"
              cp -a "$archive_dir/." "$out/"
              test -s "$out/matched-shuffle-vet/vet-summary.json"
              test -s "$out/vet-summary.json"
              echo "$VET_RUN" > "$out/vet-checkpoint-run.txt"
              exit 0
            fi
            if test "$(gh run view "$VET_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)" = completed; then
              echo 'The required vetting checkpoint was not produced.' >&2
              exit 1
            fi
            sleep 30
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r "$SURVEY/requirements.txt"
      - run: python "$SURVEY/check_pipeline.py"
      - name: Search every spectrum and run controls
        if: env.STAGE == 'scan' || env.STAGE == 'full'
        run: |
          python "$SURVEY/scan.py" "$RELEASE" scan --cache "$RUNNER_TEMP/hetdex" --output "$SURVEY/evidence/$RELEASE" --workers 3
      - name: Adjudicate leads and measure off-source apertures
        if: env.STAGE == 'vet' || env.STAGE == 'full'
        run: |
          python "$SURVEY/scan.py" "$RELEASE" vet --cache "$RUNNER_TEMP/hetdex" --output "$SURVEY/evidence/$RELEASE"
      - name: Check independent spectral archives for all viable line pairs and extreme EWs
        if: env.STAGE == 'focus' || env.STAGE == 'full'
        run: |
          python "$SURVEY/focus.py" "$SURVEY/evidence/$RELEASE" "$SURVEY/evidence/$RELEASE/focus" --release "$RELEASE" --cache "$RUNNER_TEMP/hetdex" --vet
      - name: Test recurrent knot geometries in independent datacubes
        if: env.STAGE == 'focus' || env.STAGE == 'full'
        run: |
          python "$SURVEY/repeat_blobs.py" "$SURVEY/evidence/$RELEASE" "$SURVEY/evidence/$RELEASE/repeat-blobs" --release "$RELEASE" --cache "$RUNNER_TEMP/hetdex"
      - name: Wait for the original evidence commit before publishing the supplement
        if: env.STAGE == 'focus' && matrix.release == 'sc1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f "$SURVEY/evidence/$RELEASE/vet-checkpoint-run.txt"; then
            for attempt in $(seq 1 40); do
              if test "$(gh run view "$VET_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)" = completed; then exit 0; fi
              sleep 15
            done
            exit 1
          fi
      - name: Record execution revision and package versions
        if: always()
        run: |
          mkdir -p "$SURVEY/evidence/$RELEASE"
          {
            git rev-parse HEAD
            echo "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            python --version
            python -m pip freeze
          } > "$SURVEY/evidence/$RELEASE/execution-$STAGE.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ matrix.release }}
          path: results/hetdex_blind_emitters/evidence/${{ matrix.release }}/
          if-no-files-found: warn
          retention-days: 3

  publish:
    if: always() && needs.research.result != 'skipped' && github.ref == 'refs/heads/science/hetdex-blind-emitter-search'
    needs: research
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/hetdex-blind-emitter-search
      - uses: actions/download-artifact@v4
        with:
          pattern: research-*
          path: ${{ runner.temp }}/hetdex-receipts
      - name: Commit evidence to the research branch
        run: |
          for release in sc1 sc2; do
            src="$RUNNER_TEMP/hetdex-receipts/research-$release"
            if test -d "$src"; then
              mkdir -p "$SURVEY/evidence/$release"
              cp -r "$src/." "$SURVEY/evidence/$release/"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SURVEY/evidence"
          git diff --cached --quiet || git commit -m "Record HETDEX $STAGE evidence from run $GITHUB_RUN_ID"
          git push origin HEAD:science/hetdex-blind-emitter-search

      - name: Build claim and verify branch
        if: (env.STAGE == 'focus' || env.STAGE == 'full') && needs.research.result == 'success'
        run: |
          python "$SURVEY/report.py"
          git add README.md "$SURVEY"
          git diff --cached --quiet || git commit -m 'Report HETDEX results, sensitivity limits and catalog counts'
          python -m open_space.verify > "$RUNNER_TEMP/verify.txt" || { tail -100 "$RUNNER_TEMP/verify.txt"; exit 1; }
          python -m unittest discover -s tests > "$RUNNER_TEMP/unittest.txt" 2>&1 || { tail -100 "$RUNNER_TEMP/unittest.txt"; exit 1; }
          tail -6 "$RUNNER_TEMP/verify.txt"
          tail -4 "$RUNNER_TEMP/unittest.txt"
          git push origin HEAD:science/hetdex-blind-emitter-search
