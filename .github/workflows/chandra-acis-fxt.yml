name: Chandra ACIS blind fast-transient survey

on:
  # Runs once when this file changes on the research branch: a workflow_dispatch-only
  # file cannot be dispatched until it exists on the default branch.
  push:
    branches: [research/chandra-acis-fast-transients]
    paths: ['.github/workflows/chandra-acis-fxt.yml']
  workflow_dispatch:
    inputs:
      primary_finalize:
        description: 'Finish the archived primary run and its written review'
        type: boolean
        default: false
      final_stage:
        description: 'Phase of final scientific review'
        type: choice
        options: [repair, context, publish]
        default: repair
      final_partial:
        description: 'Save partial worker evidence for continuation'
        type: boolean
        default: false
      final_bounded_reason:
        description: 'Scientific reason for a bounded result after attempted repairs'
        required: false
        type: string
      primary_deposit:
        description: 'Verify and deposit completed primary products in batches'
        type: boolean
        default: false
      target_review:
        description: 'Run the pinned priority-source follow-up'
        type: boolean
        default: false
      replay_obsid:
        description: 'Optional deposited ObsID to replay from byte receipts'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: chandra-acis-fxt-${{ github.ref }}${{ (inputs.replay_obsid != '' || contains(github.event.head_commit.message, '[replay-obsid ')) && '-replay' || (inputs.primary_finalize == true || contains(github.event.head_commit.message, '[primary-finalize]')) && '-deposit' || (inputs.target_review == true || contains(github.event.head_commit.message, '[target-review]')) && '-target' || (inputs.primary_deposit == true || contains(github.event.head_commit.message, '[primary-deposit]')) && '-deposit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[replace-run]') }}

jobs:
  primary-deposit:
    if: >-
      !contains(github.event.head_commit.message, '[replay-obsid ') &&
      inputs.primary_finalize != true && !contains(github.event.head_commit.message, '[primary-finalize]') &&
      github.ref == 'refs/heads/research/chandra-acis-fast-transients' &&
      (inputs.primary_deposit == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[primary-deposit]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: write
      actions: read
    env:
      SURVEY: results/chandra_acis_fxt
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research/chandra-acis-fast-transients
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - name: Check source artifact validation and exposure accounting before import
        env:
          PYTHONPATH: results/chandra_acis_fxt
        run: python -m unittest test_ingest_primary test_progress
      - name: Synchronize the latest published catalog into the research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python "$SURVEY/sync_catalog.py"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
      - name: Deposit newly completed data batches and their exact science coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u "$SURVEY/checkpoint.py" collect
      - name: Check published CSC variability for real and scrambled instrument passes
        run: python -u "$SURVEY/checkpoint.py" csc
      - name: Characterize optical and infrared counterparts of all retained real triggers
        run: python -u "$SURVEY/checkpoint.py" optical
      - name: Verify the deposited repository and its survey regression fixtures
        run: |
          python "$SURVEY/scope_check.py"
          python "$SURVEY/verify_resources.py" verify "$RUNNER_TEMP/chandra-check-resources"
          python "$SURVEY/verify_resources.py" tests "$RUNNER_TEMP/chandra-check-resources"
          python "$SURVEY/verify_resources.py" survey-tests "$RUNNER_TEMP/chandra-check-resources"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chandra-check-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chandra-check-resources
          if-no-files-found: ignore

  target-review:
    if: >-
      !contains(github.event.head_commit.message, '[replay-obsid ') &&
      inputs.primary_finalize != true && !contains(github.event.head_commit.message, '[primary-finalize]') &&
      github.ref == 'refs/heads/research/chandra-acis-fast-transients' &&
      (inputs.target_review == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[target-review]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 295
    permissions:
      contents: write
      actions: read
    env:
      REVIEW: results/chandra_acis_fxt/evidence/priority/44985879443
      SURVEY: results/chandra_acis_fxt
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chandra-evidence-31
          run-id: '44985879443'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/target-source/chandra-evidence-31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chandra-evidence-19
          run-id: '44985879443'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/target-source/chandra-evidence-19
      - name: Verify the original event-file identities and measured triggers
        run: |
          mkdir -p "$REVIEW"
          python -u "$SURVEY/priority.py" seed "$RUNNER_TEMP/target-source" "$REVIEW"
      - name: Test the source and neighboring aperture on the original photons
        id: photons
        continue-on-error: true
        run: python -u "$SURVEY/priority.py" photons "$REVIEW"
      - name: Retrieve independent optical and infrared measurements
        id: optical
        continue-on-error: true
        run: python -u "$SURVEY/target_optical.py" --leads "$REVIEW/leads.json" --out "$REVIEW/optical"
      - name: Checkpoint the source, optical and background diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$REVIEW"
          git diff --cached --quiet || git commit -qm "Deposit priority flare photons and optical counterpart evidence"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
      - name: Inspect contemporaneous archived GCN circulars
        id: alerts
        continue-on-error: true
        run: python -u "$SURVEY/alerts.py" --evidence "$REVIEW"
      - name: Search independent public Chandra visits across the mission
        id: history
        continue-on-error: true
        timeout-minutes: 160
        run: python -u "$SURVEY/target_history.py" --leads "$REVIEW/leads.json" --out "$REVIEW/history" --release-through 2026-11-21
      - name: Retain the complete targeted follow-up and individual failures
        if: always()
        env:
          PHOTON_STATUS: ${{ steps.photons.outcome }}
          OPTICAL_STATUS: ${{ steps.optical.outcome }}
          ALERT_STATUS: ${{ steps.alerts.outcome }}
          HISTORY_STATUS: ${{ steps.history.outcome }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          out = Path(os.environ['REVIEW'])
          out.mkdir(parents=True, exist_ok=True)
          result = {name.lower():os.environ[name+'_STATUS'] for name in ('PHOTON','OPTICAL','ALERT','HISTORY')}
          result['run_id'] = os.environ['GITHUB_RUN_ID']
          (out/'execution.json').write_text(json.dumps(result,indent=2)+'\n')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$REVIEW"
          git diff --cached --quiet || git commit -qm "Deposit counterpart, all-mission visit and notice checks"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-priority-followup
          path: results/chandra_acis_fxt/evidence/priority
          if-no-files-found: warn
          retention-days: 90
      - name: Verify the targeted evidence tree and repository tests
        run: |
          python -m open_space.verify
          python -m unittest discover -s tests
      - name: Check each follow-up service after depositing its outcome
        if: steps.photons.outcome != 'success' || steps.optical.outcome != 'success' || steps.history.outcome != 'success' || steps.alerts.outcome != 'success'
        run: exit 1

  verify:
    needs: inventory
    if: >-
      inputs.primary_finalize != true && !contains(github.event.head_commit.message, '[primary-finalize]') &&
      !cancelled() && github.ref == 'refs/heads/research/chandra-acis-fast-transients' &&
      ((needs.inventory.result == 'success' && needs.inventory.outputs.checkpoint != '') ||
       (needs.inventory.result == 'skipped' && ((github.event_name == 'workflow_dispatch' && inputs.replay_obsid != '') ||
         (github.event_name == 'push' && contains(github.event.head_commit.message, '[replay-obsid ')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inventory.outputs.checkpoint || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt pandas==2.2.3
      - run: python -m unittest discover -s results/chandra_acis_fxt -p 'test_*.py'
      - run: python results/chandra_acis_fxt/alerts.py --self-test
      - run: python results/chandra_acis_fxt/archive_attestation.py
      - name: Verify the frozen checkout and measure resource use
        run: python results/chandra_acis_fxt/verify_resources.py verify "$RUNNER_TEMP/chandra-verify-resources"
      - name: Run the repository tests and measure resource use
        run: python results/chandra_acis_fxt/verify_resources.py tests "$RUNNER_TEMP/chandra-verify-resources"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chandra-verify-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chandra-verify-resources
          if-no-files-found: ignore
      - name: Replay a checksummed pilot against its deposited controls and injections
        if: inputs.replay_obsid == '' && !contains(github.event.head_commit.message, '[replay-obsid ')
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python results/chandra_acis_fxt/reproduce.py 25268

  replay:
    needs: verify
    if: >-
      inputs.primary_finalize != true && !contains(github.event.head_commit.message, '[primary-finalize]') &&
      !cancelled() && needs.verify.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.replay_obsid != '') ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[replay-obsid ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Retrieve exact products and compare against the deposited search
        env:
          OBSID_INPUT: ${{ inputs.replay_obsid }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          export CIAO_PREFIX="$RUNNER_TEMP/ciao" PATH="$PATH:$CONDA/bin"
          python - <<'PYTHON'
          import os, re, subprocess, sys
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              requested = [os.environ["OBSID_INPUT"]]
          else:
              requested = re.findall(r"\[replay-obsid ([1-9][0-9]{0,5})\]", os.environ["COMMIT_MESSAGE"])
          if len(requested) != 1 or not re.fullmatch(r"[1-9][0-9]{0,5}", requested[0]):
              raise ValueError("Specify exactly one numeric observation ID for replay")
          subprocess.run([sys.executable, "-u", "results/chandra_acis_fxt/catalog_pack.py", "replay", requested[0]], check=True)
          PYTHON

  catalog-check:
    if: >-
      !contains(github.event.head_commit.message, '[replay-obsid ') &&
      inputs.primary_finalize != true && !contains(github.event.head_commit.message, '[primary-finalize]') &&
      github.ref == 'refs/heads/research/chandra-acis-fast-transients' && inputs.replay_obsid == '' &&
      inputs.target_review != true && !contains(github.event.head_commit.message, '[target-review]') &&
      inputs.primary_deposit != true && !contains(github.event.head_commit.message, '[primary-deposit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Validate real counterpart services against their documented catalog fields
        run: python -u results/chandra_acis_fxt/vet.py --probe "$RUNNER_TEMP/catalog-probe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-catalog-probe
          path: ${{ runner.temp }}/catalog-probe
          if-no-files-found: warn
          overwrite: true

  inventory:
    needs: catalog-check
    if: github.ref == 'refs/heads/research/chandra-acis-fast-transients' && inputs.replay_obsid == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    permissions:
      contents: write
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      checkpoint: ${{ steps.deposit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chandra-catalog-probe
          path: results/chandra_acis_fxt/evidence/catalog_probe/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retrieve completed shards from the original frozen search
        if: hashFiles('results/chandra_acis_fxt/evidence/history/44981778618/migration.json') == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: chandra-evidence-*
          run-id: '44981778618'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-evidence
          merge-multiple: false
      - name: Reuse frozen scans and queue corrected counterpart classifications
        run: |
          mkdir -p "$RUNNER_TEMP/prior-evidence"
          python results/chandra_acis_fxt/migrate.py "$RUNNER_TEMP/prior-evidence" \
            --reviewed vet.py=76ddfd371cf8f02bd54c3653547f12c74a1a23d09fa7e0bbd2fa933ad5f79d8a
      - name: Reconcile the native ACIS rows and released ObsIDs
        run: python results/chandra_acis_fxt/campaign.py plan
      - name: Look up missing first-public dates in the HEASARC mirror
        run: |
          survey=results/chandra_acis_fxt
          mkdir -p "$survey/evidence/release_supplement"
          python "$survey/exceptions.py" "$survey/evidence/inventory" "$survey/evidence/release_supplement"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-release-supplement
          path: results/chandra_acis_fxt/evidence/release_supplement
          if-no-files-found: warn
          overwrite: true
      - name: Exercise the complete search on three archive observations
        id: pilot
        continue-on-error: true
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/candidate-inputs" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin" OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python -u results/chandra_acis_fxt/pilot.py
      - id: plan
        run: python results/chandra_acis_fxt/campaign.py plan
      - name: Publish the prespecified three-ObsID pilot measurement
        if: steps.pilot.outcome == 'success'
        env:
          PYTHONPATH: results/chandra_acis_fxt
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil
          from tempfile import TemporaryDirectory
          import report
          from campaign import EVIDENCE, HERE, dump, read, read_obs

          pilot = read(EVIDENCE / "pilot.json")
          ids = [int(row["obsid"]) for row in pilot["selected"]]
          if len(ids) != 3 or len(set(ids)) != 3:
              raise ValueError("Expected the three original count-stratified pilot observations")
          rel = Path("provisional") / (os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          destination = EVIDENCE / rel
          destination.mkdir(parents=True, exist_ok=True)
          with TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as work:
              view = Path(work)
              (view / "inventory").symlink_to(EVIDENCE / "inventory", target_is_directory=True)
              (view / "observations").mkdir()
              for oid in ids:
                  target = EVIDENCE / "observations" / f"{oid}.json.gz"
                  if read_obs(target)["status"] != "complete":
                      raise ValueError(f"Incomplete fixed pilot ObsID {oid}")
                  shutil.copyfile(target, view / "observations" / target.name)
              report.EVIDENCE = view
              report.run()
              for item in view.iterdir():
                  if item.name == "inventory":
                      continue
                  if item.is_dir():
                      shutil.copytree(item, destination / item.name, dirs_exist_ok=True)
                  else:
                      shutil.copyfile(item, destination / item.name)
          summary = read(destination / "summary.json")
          dump(destination / "scope.json", {"pilot_obsids": ids, "selection": pilot["selection"],
                                           "inventory_sha256": pilot["inventory_sha256"]})
          text = (HERE / "README.md").read_text().replace("(evidence/", f"(evidence/{rel}/")
          note = ("This pre-fan-out checkpoint measures only the three pilot observations selected "
                  "by catalog event count before the scan. Every other ObsID, including pending "
                  "observations and recovered shards, is outside this measurement.")
          (HERE / "README.md").write_text(text + "\n" + note + "\n")
          (destination / "README.md").write_text(text.replace(f"(evidence/{rel}/", "(")
                                                .replace("(METHODS.md)", "(../../../METHODS.md)") + "\n" + note + "\n")
          headline = text.splitlines()[2].strip("*")
          report.update_catalog("Three-ObsID pilot checkpoint. " + headline, summary["label"])
          PYTHON
          git diff --check -- README.md results/chandra_acis_fxt/README.md
      - name: Deposit inventory and early observation evidence on the branch
        id: deposit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md results/chandra_acis_fxt/README.md results/chandra_acis_fxt/evidence
          git diff --cached --quiet || git commit -m "Checkpoint the Chandra release census and first observation ledgers"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-event-inputs-pilot
          path: ${{ runner.temp }}/candidate-inputs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-inventory
          path: results/chandra_acis_fxt/evidence/inventory
          if-no-files-found: warn
          overwrite: true

      - name: Confirm archive data can be scanned
        if: steps.pilot.outcome != 'success'
        run: exit 1

  early:
    needs: [verify, inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inventory.outputs.checkpoint }}
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Search the count-stratified cohort with the frozen pipeline
        env:
          GROUP: ${{ matrix.group }}
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/candidate-inputs" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin"
          python -u results/chandra_acis_fxt/early.py group "$GROUP" "$RUNNER_TEMP/shard"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-early-${{ matrix.group }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-inputs-early-${{ matrix.group }}
          path: ${{ runner.temp }}/candidate-inputs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
          overwrite: true

  early-deposit:
    needs: [verify, inventory, early]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && needs.inventory.result == 'success'
          && (needs.early.result == 'success' || needs.early.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      checkpoint: ${{ steps.deposit.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inventory.outputs.checkpoint }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: chandra-early-*
          path: results/chandra_acis_fxt/evidence
          merge-multiple: true
      - name: Record the scope, exposure and outcomes of the early cohort
        run: python results/chandra_acis_fxt/early.py deposit
      - name: Reassign every outstanding ObsID in the full inventory
        id: plan
        run: python results/chandra_acis_fxt/campaign.py plan
      - name: Deposit the early cohort and updated census on the research branch
        id: deposit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md results/chandra_acis_fxt/README.md results/chandra_acis_fxt/evidence
          git diff --cached --quiet || git commit -m "Deposit the prespecified moderate-count Chandra cohort"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  observation:
    needs: early-deposit
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.early-deposit.outputs.matrix) }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.early-deposit.outputs.checkpoint }}
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Search assigned observations and record all outcomes
        env:
          GROUP: ${{ matrix.group }}
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/candidate-inputs" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin"
          python results/chandra_acis_fxt/campaign.py shard "$GROUP" "$RUNNER_TEMP/shard"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-evidence-${{ matrix.group }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-event-inputs-${{ matrix.group }}
          path: ${{ runner.temp }}/candidate-inputs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
          overwrite: true

  supplement:
    needs: [inventory, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inventory.outputs.checkpoint }}
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Search observations with unresolved release dates as a separate sample
        timeout-minutes: 315
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/supplement-inputs" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin"
          python -u results/chandra_acis_fxt/ambiguous.py --evidence results/chandra_acis_fxt/evidence \
            --output "$RUNNER_TEMP/supplement"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-supplemental-search
          path: ${{ runner.temp }}/supplement
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-supplemental-event-inputs
          path: ${{ runner.temp }}/supplement-inputs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
          overwrite: true

  report:
    if: >-
      !cancelled() && needs.inventory.result == 'success' && needs.verify.result == 'success' &&
      (needs.observation.result == 'success' || needs.observation.result == 'failure')
    needs: [inventory, verify, early-deposit, observation, supplement]
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.early-deposit.outputs.checkpoint }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: chandra-evidence-*
          path: results/chandra_acis_fxt/evidence
          merge-multiple: true
      - name: Collect the independent unresolved-release search
        id: collect_supplement
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chandra-supplemental-search
          path: results/chandra_acis_fxt/evidence/supplemental_search/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build the coverage ledger and report
        run: python results/chandra_acis_fxt/report.py
      - name: Inspect other Chandra visits to unresolved sky positions
        id: visits
        continue-on-error: true
        timeout-minutes: 75
        run: |
          survey=results/chandra_acis_fxt
          mkdir -p "$survey/evidence/independent_visits"
          python -u "$survey/visits.py" --evidence "$survey/evidence" \
            >"$survey/evidence/independent_visits/command.log" 2>&1
      - name: Compare unresolved leads to contemporaneous GCN circulars
        id: alerts
        continue-on-error: true
        timeout-minutes: 35
        run: |
          survey=results/chandra_acis_fxt
          mkdir -p "$survey/evidence/alerts"
          python -u "$survey/alerts.py" --evidence "$survey/evidence" \
            >"$survey/evidence/alerts/command.log" 2>&1
      - name: Assemble per-lead evidence for written review
        id: review
        continue-on-error: true
        run: |
          survey=results/chandra_acis_fxt
          python -u "$survey/review.py" --evidence "$survey/evidence" \
            >"$survey/evidence/lead-review-command.log" 2>&1
      - name: Record independent follow-up outcomes
        env:
          VISIT_OUTCOME: ${{ steps.visits.outcome }}
          ALERT_OUTCOME: ${{ steps.alerts.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SUPPLEMENT_JOB: ${{ needs.supplement.result }}
          SUPPLEMENT_COLLECTION: ${{ steps.collect_supplement.outcome }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          evidence = Path("results/chandra_acis_fxt/evidence")
          record = {"run_id": os.environ["GITHUB_RUN_ID"], "independent_visits": os.environ["VISIT_OUTCOME"],
                    "alerts": os.environ["ALERT_OUTCOME"], "review": os.environ["REVIEW_OUTCOME"],
                    "supplement_job": os.environ["SUPPLEMENT_JOB"],
                    "supplement_collection": os.environ["SUPPLEMENT_COLLECTION"],
                    "supplement_directory": "supplemental_search/" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]}
          (evidence / "followup_execution.json").write_text(json.dumps(record, indent=2) + "\n")
          PYTHON
      - name: Verify the exact proposed commit before updating the research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md results/chandra_acis_fxt/README.md results/chandra_acis_fxt/evidence
          git diff --cached --quiet || git commit -m "Deposit ACIS search coverage, controls, injections and trigger evidence"
          python -m open_space.verify
          python -m unittest discover -s tests
          python -m unittest discover -s results/chandra_acis_fxt -p 'test_*.py'
          git push origin "HEAD:refs/heads/research/chandra-acis-fast-transients"
      - name: Check for unfinished observations
        run: python results/chandra_acis_fxt/report.py --check-coverage
      - name: Check follow-up commands after evidence deposit
        if: >-
          steps.visits.outcome != 'success' || steps.alerts.outcome != 'success' || steps.review.outcome != 'success' ||
          needs.supplement.result != 'success' || steps.collect_supplement.outcome != 'success'
        run: exit 1

  final-route:
    if: >-
      !contains(github.event.head_commit.message, '[replay-obsid ') &&
      github.ref == 'refs/heads/research/chandra-acis-fast-transients' &&
      (inputs.primary_finalize == true || (github.event_name == 'push' && contains(github.event.head_commit.message,'[primary-finalize]'))) &&
      inputs.target_review != true && inputs.primary_deposit != true && inputs.replay_obsid == '' &&
      !contains(github.event.head_commit.message,'[target-review]') && !contains(github.event.head_commit.message,'[primary-deposit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: read
      contents: write
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      partial: ${{ steps.route.outputs.partial }}
      ref: ${{ steps.base.outputs.ref }}
      tools: ${{ steps.tools.outputs.sha }}
      tools_name: ${{ steps.tools.outputs.artifact }}
    env:
      BRANCH: research/chandra-acis-fast-transients
      SURVEY: results/chandra_acis_fxt
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Determine requested final phase
        id: route
        env:
          INPUT_PHASE: ${{ inputs.final_stage }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ALLOW_PARTIAL: ${{ inputs.final_partial }}
        run: |
          python - <<'PY'
          import os
          m=os.environ["COMMIT_MESSAGE"]
          selectors=[word for word in ("context","publish") if "[final-"+word+"]" in m]
          if len(selectors)>1:
              raise SystemExit("Conflicting final phase modifiers")
          phase=(os.environ["INPUT_PHASE"] or "repair") if os.environ["GITHUB_EVENT_NAME"]=="workflow_dispatch" else (selectors or ["repair"])[0]
          if phase not in {"repair","context","publish"}:
              raise SystemExit("Unknown phase")
          partial=os.environ["ALLOW_PARTIAL"].lower()=="true" or "[final-partial]" in m
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("phase="+phase,file=f)
              print("partial="+str(partial).lower(),file=f)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research/chandra-acis-fast-transients
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - name: Check terminal source and synchronize the current catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44985879443" > "$RUNNER_TEMP/primary-run.json"
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ["RUNNER_TEMP"]+"/primary-run.json"))
          if (r["id"],r["head_sha"],r["status"],r["run_attempt"],r["head_branch"])!=(44985879443,"4663ab98666b5d9b5b116478f61d6cae5d49e104","completed",1,os.environ["BRANCH"]):
              raise SystemExit("Finalization waits for the pinned primary run to reach a terminal status")
          PY
          git diff --quiet "$GITHUB_SHA" HEAD -- .github/workflows/chandra-acis-fxt.yml "$SURVEY/finalize.py" "$SURVEY/final_assembly.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python "$SURVEY/sync_catalog.py"
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Prepare the bounded fast-forward branch writer
        id: tools
        run: |
          mkdir -p "$RUNNER_TEMP/final-tools"
          cat > "$RUNNER_TEMP/final-tools/push.py" <<'PY'
          """Publish only declared Chandra paths through an isolated Git index."""
          import hashlib,json,os,subprocess,sys,tempfile,time
          from pathlib import Path
          BR="research/chandra-acis-fast-transients"
          SUR="results/chandra_acis_fxt"
          env=os.environ.copy()
          env.update(GIT_AUTHOR_NAME="github-actions[bot]",GIT_COMMITTER_NAME="github-actions[bot]",
                     GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com",
                     GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com")
          def git(*a,inp=None,stdin=None,env_=None):
              return subprocess.run(["git",*a],input=inp,stdin=stdin,stdout=subprocess.PIPE,
                                    env=env_ or env,check=True).stdout
          msg,*paths=sys.argv[1:]
          if not paths or os.environ.get("GITHUB_REF")!="refs/heads/"+BR:
              raise SystemExit("No authorized branch or paths")
          for name in paths:
              p=Path(name)
              if p.is_absolute() or ".." in p.parts or (p!=Path("README.md") and not p.is_relative_to(SUR)):
                  raise SystemExit("Path outside the Chandra deposit: "+name)
          original=git("rev-parse","HEAD").strip().decode()
          def remote():
              git("fetch","--quiet","--no-tags","origin","+refs/heads/"+BR+":refs/remotes/origin/"+BR)
              return git("rev-parse","refs/remotes/origin/"+BR).strip().decode()
          def tree(commit):
              ret={}
              for row in git("ls-tree","-r","-z",commit,"--",*paths).split(b"\0"):
                  if row:
                      header,name=row.split(b"\t",1)
                      mode,kind,oid=header.decode().split()
                      if kind!="blob": raise ValueError("Unexpected non-file result")
                      ret[os.fsdecode(name)]=mode+" "+oid
              return ret
          base=tree(original)
          state=Path(os.environ["RUNNER_TEMP"])/"published-final-blobs.json"
          known=json.loads(state.read_text()) if state.exists() else {}
          changed=set(filter(None,(git("diff","--no-renames","--name-only","-z","HEAD","--",*paths)+
                                   git("ls-files","--others","--exclude-standard","-z","--",*paths)).split(b"\0")))
          targets={}
          for n in changed:
              name=os.fsdecode(n)
              p=Path(name)
              if p.is_symlink(): raise ValueError("Refusing a result symlink: "+name)
              if not p.exists(): targets[name]=(None,0); continue
              with p.open("rb") as f: oid=git("hash-object","-w","--stdin",stdin=f).strip().decode()
              targets[name]=(("100755" if p.stat().st_mode&0o111 else "100644")+" "+oid,p.stat().st_size)
          def finalpath(n):
              return (n=="README.md" or n==SUR+"/README.md" or n.endswith(("/vet.py","/inventory/campaign.json",
                      "/publication.json","/release.json","/result.json","/candidate_inputs/manifest.json","/stage_seal.json")))
          def packed(commit,parent):
              with tempfile.TemporaryFile() as out:
                  proc=subprocess.run(["git","pack-objects","--thin","--delta-base-offset","--revs","--stdout"],
                       input=f"{commit}\n^{parent}\n".encode(),stdout=out,stderr=subprocess.PIPE,check=True)
                  return out.tell()
          def send(batch):
              for attempt in range(4):
                  tip=remote()
                  current=tree(tip)
                  updates=[]
                  for n in batch:
                      target=targets[n][0]
                      if current.get(n)==target: continue
                      if current.get(n)!=base.get(n) and not(n in known and current.get(n)==known[n]):
                          raise ValueError("Remote evidence changed independently: "+n)
                      updates.append(n)
                  if not updates: return tip
                  with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as tmp:
                      alt={**env,"GIT_INDEX_FILE":tmp+"/index"}
                      git("read-tree",tip,env_=alt)
                      buf=b"".join((targets[n][0] or ("0 "+"0"*40)).encode()+b"\t"+os.fsencode(n)+b"\0" for n in updates)
                      git("update-index","-z","--index-info",inp=buf,env_=alt)
                      newtree=git("write-tree",env_=alt).strip().decode()
                      commit=git("commit-tree",newtree,"-p",tip,"-m",msg).strip().decode()
                  size=packed(commit,tip)
                  if size>64*1024**2:
                      if len(updates)==1:
                          raise ValueError("A single Git object exceeds the 64 MiB measured-push budget: "+updates[0])
                      cut=len(updates)//2
                      send(updates[:cut]); return send(updates[cut:])
                  push=subprocess.run(["git","push","origin",commit+":refs/heads/"+BR])
                  if push.returncode==0:
                      known.update({n:targets[n][0] for n in updates})
                      state.write_text(json.dumps(known,sort_keys=True))
                      print(f"{commit}: {len(updates)} paths, measured {size} bytes",flush=True)
                      return commit
                  if remote()==tip and attempt==3: raise RuntimeError("Fast-forward push failed")
                  time.sleep(1+attempt)
              raise RuntimeError("Branch advanced repeatedly during the deposit")
          last=remote()
          # Commit manifests, the campaign identity and both catalog pages after their data.
          for end in (False,True):
              batch=[]; weight=0
              for name in sorted(n for n in targets if finalpath(n)==end):
                  size=targets[name][1]
                  if batch and (weight+size>48*1024**2 or len(batch)>=2500):
                      last=send(batch); batch=[]; weight=0
                  batch.append(name); weight+=size
              if batch: last=send(batch)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: print("sha="+last,file=f)
          PY
          echo "artifact=chandra-final-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$RUNNER_TEMP/final-tools/push.py" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chandra-final-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-tools/push.py
          if-no-files-found: error
      - name: Complete or resume original artifact ingestion before the first correction
        if: steps.route.outputs.phase == 'repair'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: results/chandra_acis_fxt
        run: |
          python -u - <<'PY'
          import os,sys,subprocess
          from pathlib import Path
          import campaign,followup,ingest_primary as ing
          root=campaign.EVIDENCE
          if campaign.read(root/"inventory/campaign.json")["implementation"]["vet.py"]==followup.NEW:
              print("Continuation reuses the previously deposited terminal source snapshot.")
              sys.exit(0)
          def call(*args): subprocess.run([sys.executable,*map(str,args)],check=True)
          prog=campaign.HERE/"ingest_primary.py"
          writer=Path(os.environ["RUNNER_TEMP"])/"final-tools/push.py"
          call(prog,"index")
          index=campaign.read(root/ing.HISTORY/"source.json")
          if index["run"]["status"]!="completed": raise ValueError("Source run must be terminal")
          pending=[(g,index["artifacts"][name]["size_in_bytes"]) for name,g in ing.EXPECTED.items()
                   if name in index["artifacts"] and not ing.receipt_file(root,g).exists()]
          batch=[]; size=0
          def deposit(ids):
              call(prog,"batch","--groups",",".join(ids),"--pack-catalogs")
              call(writer,"Deposit authenticated terminal Chandra shards",root.relative_to(campaign.HERE.parents[1]))
          for group,n in pending:
              if batch and (size+n>96*1024**2 or len(batch)>=12):
                  deposit(batch); batch=[]; size=0
              batch.append(group); size+=n
          if batch: deposit(batch)
          call(prog,"audit","--allow-partial")
          call(writer,"Record complete accounting for every terminal Chandra worker",root.relative_to(campaign.HERE.parents[1]))
          PY
      - name: Record the checked branch tip
        id: base
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          tip=$(git rev-parse "refs/remotes/origin/$BRANCH")
          git merge-base --is-ancestor HEAD "$tip"
          git diff --quiet HEAD "$tip" -- "$SURVEY/finalize.py" "$SURVEY/final_assembly.py" .github/workflows/chandra-acis-fxt.yml
          echo "ref=$tip" >> "$GITHUB_OUTPUT"

  final-plan:
    needs: final-route
    if: needs.final-route.outputs.phase == 'repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env: {SURVEY: results/chandra_acis_fxt, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
      plan_name: ${{ steps.plan.outputs.plan_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.final-route.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - name: Prepare the checksum-bound residual groups
        id: plan
        run: |
          python "$SURVEY/finalize.py" plan --bundle "$RUNNER_TEMP/plan" --groups 48
          echo "plan_sha=$(sha256sum "$RUNNER_TEMP/plan/plan.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "plan_name=chandra-final-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.plan.outputs.plan_name }}
          path: ${{ runner.temp }}/plan
          if-no-files-found: error

  final-worker:
    needs: [final-route, final-plan]
    if: needs.final-plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.final-plan.outputs.matrix) }}
    env:
      SURVEY: results/chandra_acis_fxt
      GROUP: ${{ matrix.group }}
      PLAN_SHA: ${{ needs.final-plan.outputs.plan_sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.final-route.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.final-plan.outputs.plan_name }}
          path: ${{ runner.temp }}/plan
      - name: Check the exact signed-plan digest from the generating job
        run: printf '%s  %s\n' "$PLAN_SHA" "$RUNNER_TEMP/plan/plan.json" | sha256sum -c -
      - name: Run the registered residual catalog, calibration and acquisition repairs
        timeout-minutes: 300
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/retained" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin"
          python -u "$SURVEY/finalize.py" worker --bundle "$RUNNER_TEMP/plan" --group "$GROUP" --stage "$RUNNER_TEMP/worker"
      - name: Seal all completed and interrupted receipts
        if: always()
        run: |
          python "$SURVEY/finalize.py" seal-worker --bundle "$RUNNER_TEMP/plan" --group "$GROUP" --stage "$RUNNER_TEMP/worker"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chandra-final-worker-${{ needs.final-plan.outputs.plan_sha }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker
          if-no-files-found: warn
          retention-days: 90

  final-reduce:
    needs: [final-route, final-plan, final-worker]
    if: >-
      !cancelled() && needs.final-route.outputs.phase == 'repair' &&
      needs.final-plan.result == 'success' &&
      (needs.final-worker.result == 'success' || needs.final-worker.result == 'failure' || needs.final-worker.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions: {contents: write, actions: read}
    env:
      SURVEY: results/chandra_acis_fxt
      PLAN_SHA: ${{ needs.final-plan.outputs.plan_sha }}
      PARTIAL: ${{ needs.final-route.outputs.partial }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    outputs:
      ref: ${{ steps.deposit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.final-route.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.final-route.outputs.tools_name }}
          path: ${{ runner.temp }}/final-tools
      - name: Check the bounded branch writer
        env:
          TOOLS_SHA: ${{ needs.final-route.outputs.tools }}
        run: printf '%s  %s\n' "$TOOLS_SHA" "$RUNNER_TEMP/final-tools/push.py" | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.final-plan.outputs.plan_name }}
          path: ${{ runner.temp }}/plan
      - name: Check the exact signed-plan digest from the generating job
        run: printf '%s  %s\n' "$PLAN_SHA" "$RUNNER_TEMP/plan/plan.json" | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.final-plan.outputs.has_work == 'true'
        with:
          pattern: chandra-final-worker-${{ needs.final-plan.outputs.plan_sha }}-*
          merge-multiple: false
          path: ${{ runner.temp }}/worker-stages
      - name: Verify and reduce only authenticated worker stages
        run: |
          mkdir -p "$RUNNER_TEMP/worker-stages"
          opts=()
          if [[ "$PARTIAL" == true ]]; then opts+=(--checkpoint-partial); fi
          python "$SURVEY/finalize.py" reduce --bundle "$RUNNER_TEMP/plan" --workers "$RUNNER_TEMP/worker-stages" "${opts[@]}"
      - name: Deposit corrective ledgers and the reviewed source identity
        id: deposit
        run: python "$RUNNER_TEMP/final-tools/push.py" "Deposit the audited Chandra corrective reduction" "$SURVEY/evidence" "$SURVEY/vet.py"

  final-report:
    needs: [final-route, final-reduce]
    if: >-
      !cancelled() && needs.final-route.result == 'success' &&
      (needs.final-route.outputs.phase == 'context' || (needs.final-route.outputs.phase == 'repair' && needs.final-reduce.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions: {contents: write, actions: read}
    env: {SURVEY: results/chandra_acis_fxt, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    outputs:
      ref: ${{ steps.deposit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.final-reduce.outputs.ref || needs.final-route.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.final-route.outputs.tools_name }}
          path: ${{ runner.temp }}/final-tools
      - name: Check the bounded branch writer
        env:
          TOOLS_SHA: ${{ needs.final-route.outputs.tools }}
        run: printf '%s  %s\n' "$TOOLS_SHA" "$RUNNER_TEMP/final-tools/push.py" | sha256sum -c -
      - name: Build complete corrected search, control and injection tables
        run: python "$SURVEY/finalize.py" report
      - name: Deposit measured tables while written claims remain in review
        id: deposit
        run: python "$RUNNER_TEMP/final-tools/push.py" "Deposit corrected Chandra primary measurement tables" "$SURVEY/evidence"

  final-context:
    needs: [final-route, final-report]
    if: needs.final-report.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions: {contents: write, actions: read}
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        task: [heldout, csc, optical, visits, alerts]
    env:
      SURVEY: results/chandra_acis_fxt
      TASK: ${{ matrix.task }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.final-report.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.final-route.outputs.tools_name }}
          path: ${{ runner.temp }}/final-tools
      - name: Check the bounded branch writer
        env:
          TOOLS_SHA: ${{ needs.final-route.outputs.tools }}
        run: printf '%s  %s\n' "$TOOLS_SHA" "$RUNNER_TEMP/final-tools/push.py" | sha256sum -c -
      - name: Evaluate the prespecified selection or supporting evidence
        id: science
        timeout-minutes: 270
        continue-on-error: true
        run: python -u "$SURVEY/finalize.py" context "$TASK"
      - name: Preserve partial and complete context outputs
        if: always()
        run: |
          case "$TASK" in
            heldout) folder=held_out ;;
            csc) folder=csc_variability ;;
            optical) folder=lead_optical ;;
            visits) folder=independent_visits ;;
            alerts) folder=alerts ;;
            *) exit 2 ;;
          esac
          python "$RUNNER_TEMP/final-tools/push.py" "Deposit Chandra $TASK evidence and phase receipts" "$SURVEY/evidence/$folder" "$SURVEY/evidence/finalization"
      - name: Signal a context stage requiring a retry
        if: steps.science.outcome != 'success'
        run: exit 1

  final-assemble:
    needs: [final-route, final-report, final-context]
    if: >-
      !cancelled() && needs.final-route.result == 'success' &&
      (needs.final-route.outputs.phase == 'publish' || (needs.final-report.result == 'success' &&
      (needs.final-context.result == 'success' || needs.final-context.result == 'failure')))
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    permissions: {contents: write, actions: read}
    env:
      SURVEY: results/chandra_acis_fxt
      CHECKED: ${{ needs.final-report.outputs.ref || needs.final-route.outputs.ref }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    outputs:
      ref: ${{ steps.deposit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research/chandra-acis-fast-transients
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - name: Require the latest branch to descend from the verified science stage
        run: |
          git merge-base --is-ancestor "$CHECKED" HEAD
          git diff --quiet "$CHECKED" HEAD -- .github/workflows/chandra-acis-fxt.yml "$SURVEY/*.py" "$SURVEY/requirements.txt" "$SURVEY/HELD_OUT.md"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.final-route.outputs.tools_name }}
          path: ${{ runner.temp }}/final-tools
      - name: Check the bounded branch writer
        env:
          TOOLS_SHA: ${{ needs.final-route.outputs.tools }}
        run: printf '%s  %s\n' "$TOOLS_SHA" "$RUNNER_TEMP/final-tools/push.py" | sha256sum -c -
      - name: Build the human review and exact remaining-decision queue
        id: assemble
        continue-on-error: true
        run: |
          python "$SURVEY/finalize.py" context review
          python "$SURVEY/finalize.py" assemble
      - name: Deposit all verified manual dispositions and outstanding gaps
        id: deposit
        if: always()
        run: python "$RUNNER_TEMP/final-tools/push.py" "Record individual Chandra review decisions and outstanding identities" "$SURVEY/evidence/finalization" "$SURVEY/evidence/LEAD_REVIEW.md"
      - name: Hold publication for incomplete scientific or written review
        if: steps.assemble.outcome != 'success'
        run: exit 1

  final-publish:
    needs: [final-route, final-assemble]
    if: needs.final-route.outputs.phase == 'publish' && needs.final-assemble.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions: {contents: write, actions: read}
    env:
      SURVEY: results/chandra_acis_fxt
      BOUNDED_REASON: ${{ inputs.final_bounded_reason }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    outputs:
      ref: ${{ steps.deposit.outputs.sha }}
      candidates: ${{ steps.publish.outputs.candidate_products }}
      has_candidates: ${{ steps.publish.outputs.has_candidates }}
      pages_name: ${{ steps.pages.outputs.name }}
      page_sha: ${{ steps.pages.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.final-assemble.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.final-route.outputs.tools_name }}
          path: ${{ runner.temp }}/final-tools
      - name: Check the bounded branch writer
        env:
          TOOLS_SHA: ${{ needs.final-route.outputs.tools }}
        run: printf '%s  %s\n' "$TOOLS_SHA" "$RUNNER_TEMP/final-tools/push.py" | sha256sum -c -
      - name: Render the reviewed release and preserve exact candidate EVT2 inputs
        id: publish
        run: |
          opts=()
          if [[ -n "$BOUNDED_REASON" ]]; then
            opts+=(--bounded-reason "$BOUNDED_REASON")
          elif [[ "$COMMIT_MESSAGE" == *"[final-bounded]"* ]]; then
            test -s "$SURVEY/FINAL_BOUNDED_REASON.md"
            opts+=(--bounded-reason "$(cat "$SURVEY/FINAL_BOUNDED_REASON.md")")
          fi
          python -u "$SURVEY/finalize.py" publish "${opts[@]}"
      - name: Stage the final page until exact candidate replay and both repository gates pass
        id: pages
        run: |
          mkdir -p "$RUNNER_TEMP/final-pages"
          cp "$SURVEY/README.md" "$RUNNER_TEMP/final-pages/README.md"
          echo "sha=$(sha256sum "$RUNNER_TEMP/final-pages/README.md" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=chandra-final-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.pages.outputs.name }}
          path: ${{ runner.temp }}/final-pages/README.md
          if-no-files-found: error
          retention-days: 90
      - name: Deposit authenticated publication inputs in bounded fast-forward batches
        id: deposit
        run: python "$RUNNER_TEMP/final-tools/push.py" "Preserve manually reviewed Chandra candidate inputs and science receipts" "$SURVEY/evidence"

  final-candidate-replay:
    needs: [final-route, final-publish]
    if: needs.final-publish.outputs.has_candidates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions: {contents: write, actions: read}
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.final-publish.outputs.candidates) }}
    env:
      SURVEY: results/chandra_acis_fxt
      PRODUCT: ${{ matrix.product }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.final-publish.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.final-route.outputs.tools_name }}
          path: ${{ runner.temp }}/final-tools
      - name: Check the bounded branch writer
        env:
          TOOLS_SHA: ${{ needs.final-route.outputs.tools }}
        run: printf '%s  %s\n' "$TOOLS_SHA" "$RUNNER_TEMP/final-tools/push.py" | sha256sum -c -
      - name: Reproduce the blind scan, all controls and injections from the deposited exact bytes
        run: python "$SURVEY/finalize.py" candidate-replay "$PRODUCT"
      - name: Deposit candidate byte-for-byte replay evidence
        run: python "$RUNNER_TEMP/final-tools/push.py" "Record exact Chandra candidate replay" "$SURVEY/evidence/finalization"

  final-gates:
    needs: [final-route, final-publish, final-candidate-replay]
    if: >-
      !cancelled() && needs.final-publish.result == 'success' &&
      (needs.final-candidate-replay.result == 'success' || needs.final-candidate-replay.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions: {contents: write, actions: read}
    env:
      SURVEY: results/chandra_acis_fxt
      BRANCH: research/chandra-acis-fast-transients
      CHECKED: ${{ needs.final-publish.outputs.ref }}
      PAGE_SHA: ${{ needs.final-publish.outputs.page_sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research/chandra-acis-fast-transients
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - name: Require the latest branch to descend from the verified science stage
        run: |
          git merge-base --is-ancestor "$CHECKED" HEAD
          git diff --quiet "$CHECKED" HEAD -- .github/workflows/chandra-acis-fxt.yml "$SURVEY/*.py" "$SURVEY/requirements.txt" "$SURVEY/HELD_OUT.md"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.final-publish.outputs.pages_name }}
          path: ${{ runner.temp }}/final-pages
      - name: Synchronize main and prepare the reviewed pages in a local final commit
        env:
          PYTHONPATH: results/chandra_acis_fxt
        run: |
          printf '%s  %s\n' "$PAGE_SHA" "$RUNNER_TEMP/final-pages/README.md" | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python "$SURVEY/sync_catalog.py"
          python - <<'PY'
          import os,shutil
          import campaign,finalize,report
          pub=campaign.read(campaign.EVIDENCE/"publication.json")
          _,folder=finalize.cycle_path()
          release=campaign.read(folder/"release.json")
          if (release["survey_readme_sha256"],release["label"],release["headline"])!=(os.environ["PAGE_SHA"],pub["label"],pub["headline"]):
              raise ValueError("Checked publication and staged page do not agree")
          shutil.copyfile(os.environ["RUNNER_TEMP"]+"/final-pages/README.md",campaign.HERE/"README.md")
          report.update_catalog(pub["headline"],pub["label"])
          PY
          git add -- README.md "$SURVEY/README.md"
          git diff --cached --quiet || git commit -m "Publish the adjudicated Chandra FXT census and measured limits"
      - name: Check every PR path and the single catalog entry against current main
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          python "$SURVEY/scope_check.py"
      - name: Run the signed scientific checks, candidate Git-index check and required repository gates
        run: python -u "$SURVEY/finalize.py" verify-commit --receipt "$RUNNER_TEMP/chandra-final-gates/verified.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chandra-final-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chandra-final-gates/
          if-no-files-found: warn
          retention-days: 90
      - name: Fast-forward only the exact commit that passed both gates
        env:
          PYTHONPATH: results/chandra_acis_fxt
        run: |
          python - <<'PY'
          import json,os,subprocess
          r=json.load(open(os.environ["RUNNER_TEMP"]+"/chandra-final-gates/verified.json"))
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if not r["complete"] or r["verified_git_commit"]!=head:
              raise ValueError("The science checks and final commit disagree")
          PY
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
