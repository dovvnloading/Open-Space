name: Chandra ACIS blind fast-transient survey

on:
  # Runs once when this file changes on the research branch: a workflow_dispatch-only
  # file cannot be dispatched until it exists on the default branch.
  push:
    branches: [research/chandra-acis-fast-transients]
    paths: ['.github/workflows/chandra-acis-fxt.yml']
  workflow_dispatch:
    inputs:
      target_review:
        description: 'Run the pinned priority-source follow-up'
        type: boolean
        default: false
      replay_obsid:
        description: 'Optional deposited ObsID to replay from byte receipts'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: chandra-acis-fxt-${{ github.ref }}${{ (inputs.target_review == true || contains(github.event.head_commit.message, '[target-review]')) && '-target' || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[replace-run]') }}

jobs:
  target-review:
    if: >-
      github.ref == 'refs/heads/research/chandra-acis-fast-transients' &&
      (inputs.target_review == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[target-review]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 295
    permissions:
      contents: write
      actions: read
    env:
      REVIEW: results/chandra_acis_fxt/evidence/priority/44985879443
      SURVEY: results/chandra_acis_fxt
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r "$SURVEY/requirements.txt" pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chandra-evidence-31
          run-id: '44985879443'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/target-source/chandra-evidence-31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chandra-evidence-19
          run-id: '44985879443'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/target-source/chandra-evidence-19
      - name: Verify the original event-file identities and measured triggers
        run: |
          mkdir -p "$REVIEW"
          python -u "$SURVEY/priority.py" seed "$RUNNER_TEMP/target-source" "$REVIEW"
      - name: Test the source and neighboring aperture on the original photons
        id: photons
        continue-on-error: true
        run: python -u "$SURVEY/priority.py" photons "$REVIEW"
      - name: Retrieve independent optical and infrared measurements
        id: optical
        continue-on-error: true
        run: python -u "$SURVEY/target_optical.py" --leads "$REVIEW/leads.json" --out "$REVIEW/optical"
      - name: Checkpoint the source, optical and background diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$REVIEW"
          git diff --cached --quiet || git commit -qm "Deposit priority flare photons and optical counterpart evidence"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
      - name: Inspect contemporaneous archived GCN circulars
        id: alerts
        continue-on-error: true
        run: python -u "$SURVEY/alerts.py" --evidence "$REVIEW"
      - name: Search independent public Chandra visits across the mission
        id: history
        continue-on-error: true
        timeout-minutes: 160
        run: python -u "$SURVEY/target_history.py" --leads "$REVIEW/leads.json" --out "$REVIEW/history" --release-through 2026-11-21
      - name: Retain the complete targeted follow-up and individual failures
        if: always()
        env:
          PHOTON_STATUS: ${{ steps.photons.outcome }}
          OPTICAL_STATUS: ${{ steps.optical.outcome }}
          ALERT_STATUS: ${{ steps.alerts.outcome }}
          HISTORY_STATUS: ${{ steps.history.outcome }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          out = Path(os.environ['REVIEW'])
          out.mkdir(parents=True, exist_ok=True)
          result = {name.lower():os.environ[name+'_STATUS'] for name in ('PHOTON','OPTICAL','ALERT','HISTORY')}
          result['run_id'] = os.environ['GITHUB_RUN_ID']
          (out/'execution.json').write_text(json.dumps(result,indent=2)+'\n')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$REVIEW"
          git diff --cached --quiet || git commit -qm "Deposit counterpart, all-mission visit and notice checks"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-priority-followup
          path: results/chandra_acis_fxt/evidence/priority
          if-no-files-found: warn
          retention-days: 90
      - name: Verify the targeted evidence tree and repository tests
        run: |
          python -m open_space.verify
          python -m unittest discover -s tests
      - name: Check each follow-up service after depositing its outcome
        if: steps.photons.outcome != 'success' || steps.optical.outcome != 'success' || steps.history.outcome != 'success' || steps.alerts.outcome != 'success'
        run: exit 1

  verify:
    needs: inventory
    if: >-
      !cancelled() && github.ref == 'refs/heads/research/chandra-acis-fast-transients' &&
      ((needs.inventory.result == 'success' && needs.inventory.outputs.checkpoint != '') ||
       (needs.inventory.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.replay_obsid != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inventory.outputs.checkpoint || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt pandas==2.2.3
      - run: python -m unittest discover -s results/chandra_acis_fxt -p 'test_*.py'
      - run: python results/chandra_acis_fxt/alerts.py --self-test
      - run: python results/chandra_acis_fxt/archive_attestation.py
      - run: python -m open_space.verify
      - run: python -m unittest discover -s tests
      - name: Replay a checksummed pilot against its deposited controls and injections
        if: inputs.replay_obsid == ''
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python results/chandra_acis_fxt/reproduce.py 25268

  replay:
    needs: verify
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.replay_obsid != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Retrieve exact products and compare against the deposited search
        env:
          OBSID: ${{ inputs.replay_obsid }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          export CIAO_PREFIX="$RUNNER_TEMP/ciao" PATH="$PATH:$CONDA/bin"
          python results/chandra_acis_fxt/reproduce.py "$OBSID"

  catalog-check:
    if: >-
      github.ref == 'refs/heads/research/chandra-acis-fast-transients' && inputs.replay_obsid == '' &&
      inputs.target_review != true && !contains(github.event.head_commit.message, '[target-review]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Validate real counterpart services against their documented catalog fields
        run: python -u results/chandra_acis_fxt/vet.py --probe "$RUNNER_TEMP/catalog-probe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-catalog-probe
          path: ${{ runner.temp }}/catalog-probe
          if-no-files-found: warn
          overwrite: true

  inventory:
    needs: catalog-check
    if: github.ref == 'refs/heads/research/chandra-acis-fast-transients' && inputs.replay_obsid == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    permissions:
      contents: write
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      checkpoint: ${{ steps.deposit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chandra-catalog-probe
          path: results/chandra_acis_fxt/evidence/catalog_probe/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retrieve completed shards from the original frozen search
        if: hashFiles('results/chandra_acis_fxt/evidence/history/44981778618/migration.json') == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: chandra-evidence-*
          run-id: '44981778618'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-evidence
          merge-multiple: false
      - name: Reuse frozen scans and queue corrected counterpart classifications
        run: |
          mkdir -p "$RUNNER_TEMP/prior-evidence"
          python results/chandra_acis_fxt/migrate.py "$RUNNER_TEMP/prior-evidence" \
            --reviewed vet.py=76ddfd371cf8f02bd54c3653547f12c74a1a23d09fa7e0bbd2fa933ad5f79d8a
      - name: Reconcile the native ACIS rows and released ObsIDs
        run: python results/chandra_acis_fxt/campaign.py plan
      - name: Look up missing first-public dates in the HEASARC mirror
        run: |
          survey=results/chandra_acis_fxt
          mkdir -p "$survey/evidence/release_supplement"
          python "$survey/exceptions.py" "$survey/evidence/inventory" "$survey/evidence/release_supplement"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-release-supplement
          path: results/chandra_acis_fxt/evidence/release_supplement
          if-no-files-found: warn
          overwrite: true
      - name: Exercise the complete search on three archive observations
        id: pilot
        continue-on-error: true
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/candidate-inputs" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin" OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python -u results/chandra_acis_fxt/pilot.py
      - id: plan
        run: python results/chandra_acis_fxt/campaign.py plan
      - name: Publish the prespecified three-ObsID pilot measurement
        if: steps.pilot.outcome == 'success'
        env:
          PYTHONPATH: results/chandra_acis_fxt
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil
          from tempfile import TemporaryDirectory
          import report
          from campaign import EVIDENCE, HERE, dump, read, read_obs

          pilot = read(EVIDENCE / "pilot.json")
          ids = [int(row["obsid"]) for row in pilot["selected"]]
          if len(ids) != 3 or len(set(ids)) != 3:
              raise ValueError("Expected the three original count-stratified pilot observations")
          rel = Path("provisional") / (os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          destination = EVIDENCE / rel
          destination.mkdir(parents=True, exist_ok=True)
          with TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as work:
              view = Path(work)
              (view / "inventory").symlink_to(EVIDENCE / "inventory", target_is_directory=True)
              (view / "observations").mkdir()
              for oid in ids:
                  target = EVIDENCE / "observations" / f"{oid}.json.gz"
                  if read_obs(target)["status"] != "complete":
                      raise ValueError(f"Incomplete fixed pilot ObsID {oid}")
                  shutil.copyfile(target, view / "observations" / target.name)
              report.EVIDENCE = view
              report.run()
              for item in view.iterdir():
                  if item.name == "inventory":
                      continue
                  if item.is_dir():
                      shutil.copytree(item, destination / item.name, dirs_exist_ok=True)
                  else:
                      shutil.copyfile(item, destination / item.name)
          summary = read(destination / "summary.json")
          dump(destination / "scope.json", {"pilot_obsids": ids, "selection": pilot["selection"],
                                           "inventory_sha256": pilot["inventory_sha256"]})
          text = (HERE / "README.md").read_text().replace("(evidence/", f"(evidence/{rel}/")
          note = ("This pre-fan-out checkpoint measures only the three pilot observations selected "
                  "by catalog event count before the scan. Every other ObsID, including pending "
                  "observations and recovered shards, is outside this measurement.")
          (HERE / "README.md").write_text(text + "\n" + note + "\n")
          (destination / "README.md").write_text(text.replace(f"(evidence/{rel}/", "(")
                                                .replace("(METHODS.md)", "(../../../METHODS.md)") + "\n" + note + "\n")
          headline = text.splitlines()[2].strip("*")
          report.update_catalog("Three-ObsID pilot checkpoint. " + headline, summary["label"])
          PYTHON
          git diff --check -- README.md results/chandra_acis_fxt/README.md
      - name: Deposit inventory and early observation evidence on the branch
        id: deposit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md results/chandra_acis_fxt/README.md results/chandra_acis_fxt/evidence
          git diff --cached --quiet || git commit -m "Checkpoint the Chandra release census and first observation ledgers"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-event-inputs-pilot
          path: ${{ runner.temp }}/candidate-inputs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-inventory
          path: results/chandra_acis_fxt/evidence/inventory
          if-no-files-found: warn
          overwrite: true

      - name: Confirm archive data can be scanned
        if: steps.pilot.outcome != 'success'
        run: exit 1

  early:
    needs: [verify, inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inventory.outputs.checkpoint }}
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Search the count-stratified cohort with the frozen pipeline
        env:
          GROUP: ${{ matrix.group }}
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/candidate-inputs" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin"
          python -u results/chandra_acis_fxt/early.py group "$GROUP" "$RUNNER_TEMP/shard"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-early-${{ matrix.group }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-inputs-early-${{ matrix.group }}
          path: ${{ runner.temp }}/candidate-inputs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
          overwrite: true

  early-deposit:
    needs: [verify, inventory, early]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && needs.inventory.result == 'success'
          && (needs.early.result == 'success' || needs.early.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      checkpoint: ${{ steps.deposit.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inventory.outputs.checkpoint }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: chandra-early-*
          path: results/chandra_acis_fxt/evidence
          merge-multiple: true
      - name: Record the scope, exposure and outcomes of the early cohort
        run: python results/chandra_acis_fxt/early.py deposit
      - name: Reassign every outstanding ObsID in the full inventory
        id: plan
        run: python results/chandra_acis_fxt/campaign.py plan
      - name: Deposit the early cohort and updated census on the research branch
        id: deposit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md results/chandra_acis_fxt/README.md results/chandra_acis_fxt/evidence
          git diff --cached --quiet || git commit -m "Deposit the prespecified moderate-count Chandra cohort"
          git push origin HEAD:refs/heads/research/chandra-acis-fast-transients
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  observation:
    needs: early-deposit
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.early-deposit.outputs.matrix) }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.early-deposit.outputs.checkpoint }}
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Search assigned observations and record all outcomes
        env:
          GROUP: ${{ matrix.group }}
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/candidate-inputs" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin"
          python results/chandra_acis_fxt/campaign.py shard "$GROUP" "$RUNNER_TEMP/shard"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-evidence-${{ matrix.group }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-event-inputs-${{ matrix.group }}
          path: ${{ runner.temp }}/candidate-inputs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
          overwrite: true

  supplement:
    needs: [inventory, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inventory.outputs.checkpoint }}
          sparse-checkout: results/chandra_acis_fxt
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt
      - name: Search observations with unresolved release dates as a separate sample
        timeout-minutes: 315
        run: |
          export RETAIN_EVENTS="$RUNNER_TEMP/supplement-inputs" CIAO_PREFIX="$RUNNER_TEMP/ciao"
          export PATH="$PATH:$CONDA/bin"
          python -u results/chandra_acis_fxt/ambiguous.py --evidence results/chandra_acis_fxt/evidence \
            --output "$RUNNER_TEMP/supplement"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-supplemental-search
          path: ${{ runner.temp }}/supplement
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chandra-supplemental-event-inputs
          path: ${{ runner.temp }}/supplement-inputs
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
          overwrite: true

  report:
    if: >-
      !cancelled() && needs.inventory.result == 'success' && needs.verify.result == 'success' &&
      (needs.observation.result == 'success' || needs.observation.result == 'failure')
    needs: [inventory, verify, early-deposit, observation, supplement]
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.early-deposit.outputs.checkpoint }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r results/chandra_acis_fxt/requirements.txt pandas==2.2.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: chandra-evidence-*
          path: results/chandra_acis_fxt/evidence
          merge-multiple: true
      - name: Collect the independent unresolved-release search
        id: collect_supplement
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chandra-supplemental-search
          path: results/chandra_acis_fxt/evidence/supplemental_search/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build the coverage ledger and report
        run: python results/chandra_acis_fxt/report.py
      - name: Inspect other Chandra visits to unresolved sky positions
        id: visits
        continue-on-error: true
        timeout-minutes: 75
        run: |
          survey=results/chandra_acis_fxt
          mkdir -p "$survey/evidence/independent_visits"
          python -u "$survey/visits.py" --evidence "$survey/evidence" \
            >"$survey/evidence/independent_visits/command.log" 2>&1
      - name: Compare unresolved leads to contemporaneous GCN circulars
        id: alerts
        continue-on-error: true
        timeout-minutes: 35
        run: |
          survey=results/chandra_acis_fxt
          mkdir -p "$survey/evidence/alerts"
          python -u "$survey/alerts.py" --evidence "$survey/evidence" \
            >"$survey/evidence/alerts/command.log" 2>&1
      - name: Assemble per-lead evidence for written review
        id: review
        continue-on-error: true
        run: |
          survey=results/chandra_acis_fxt
          python -u "$survey/review.py" --evidence "$survey/evidence" \
            >"$survey/evidence/lead-review-command.log" 2>&1
      - name: Record independent follow-up outcomes
        env:
          VISIT_OUTCOME: ${{ steps.visits.outcome }}
          ALERT_OUTCOME: ${{ steps.alerts.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SUPPLEMENT_JOB: ${{ needs.supplement.result }}
          SUPPLEMENT_COLLECTION: ${{ steps.collect_supplement.outcome }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          evidence = Path("results/chandra_acis_fxt/evidence")
          record = {"run_id": os.environ["GITHUB_RUN_ID"], "independent_visits": os.environ["VISIT_OUTCOME"],
                    "alerts": os.environ["ALERT_OUTCOME"], "review": os.environ["REVIEW_OUTCOME"],
                    "supplement_job": os.environ["SUPPLEMENT_JOB"],
                    "supplement_collection": os.environ["SUPPLEMENT_COLLECTION"],
                    "supplement_directory": "supplemental_search/" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]}
          (evidence / "followup_execution.json").write_text(json.dumps(record, indent=2) + "\n")
          PYTHON
      - name: Verify the exact proposed commit before updating the research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md results/chandra_acis_fxt/README.md results/chandra_acis_fxt/evidence
          git diff --cached --quiet || git commit -m "Deposit ACIS search coverage, controls, injections and trigger evidence"
          python -m open_space.verify
          python -m unittest discover -s tests
          python -m unittest discover -s results/chandra_acis_fxt -p 'test_*.py'
          git push origin "HEAD:refs/heads/research/chandra-acis-fast-transients"
      - name: Check for unfinished observations
        run: python results/chandra_acis_fxt/report.py --check-coverage
      - name: Check follow-up commands after evidence deposit
        if: >-
          steps.visits.outcome != 'success' || steps.alerts.outcome != 'success' || steps.review.outcome != 'success' ||
          needs.supplement.result != 'success' || steps.collect_supplement.outcome != 'success'
        run: exit 1
