name: MAVEN final-season four-look particle-event screen
on:
  push:
    branches:
      - research/mex-vmc-2025h2-atmosphere-20261115
    paths:
      - examples/maven_sep_final_season.py
      - examples/maven_cme_forecast_alignment.py
      - tests/test_maven_sep_final_season.py
      - tests/test_maven_cme_forecast_alignment.py
      - .github/workflows/maven-final-season-sep.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-data-maven:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed analysis environment
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0
      - name: Check all deterministic uncertainty and event selection controls
        run: python -m unittest discover -s tests -p test_maven_sep_final_season.py -v
      - name: Check independent original NASA Mars forecast timestamp calculations
        run: python -m unittest discover -s tests -p test_maven_cme_forecast_alignment.py -v
      - name: Analyze full SEP/MAG/SWIA/SPICE final-season archive
        run: python examples/maven_sep_final_season.py --output results/maven-2025-sep-events/summary.json --daily results/maven-2025-sep-events/daily.csv
      - name: Reconcile extreme SEP peak with pre-event NASA DONKI Mars forecasts, preserving both CME alternatives
        run: python examples/maven_cme_forecast_alignment.py --input results/maven-2025-sep-events/summary.json --output results/maven-2025-sep-events/forecast_alignment.json
      - uses: actions/upload-artifact@v4
        with:
          name: maven-2025-sep-full-data-screen
          path: |
            results/maven-2025-sep-events/summary.json
            results/maven-2025-sep-events/daily.csv
            results/maven-2025-sep-events/forecast_alignment.json
          if-no-files-found: error
      - name: Publish checked, compact real-data results to this research branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/mex-vmc-2025h2-atmosphere-20261115'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/maven-2025-sep-events/summary.json results/maven-2025-sep-events/daily.csv results/maven-2025-sep-events/forecast_alignment.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive measured final-season MAVEN four-look SEP event evidence'
            git push origin HEAD:research/mex-vmc-2025h2-atmosphere-20261115
          fi
