name: XMM slew transients across three surveys
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Recompute the catalogue matches and local map photometry
        type: boolean
        default: false
  push:
    branches: ['survey/xmmsl2-erass1-rass']
    paths: ['.github/workflows/xmmsl2-erass1-rass.yml']
permissions:
  contents: read
concurrency:
  group: xmmsl2-erass1-rass-${{ github.ref }}
  cancel-in-progress: false
env:
  STUDY: results/xmmsl2-erass1-rass
  OUT: results/xmmsl2-erass1-rass/outputs
  PYTHONUNBUFFERED: '1'
  REFRESH: ${{ inputs.refresh || false }}
  OPENBLAS_NUM_THREADS: '1'
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/xmmsl2-erass1-rass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: work/downloads
          key: xmmsl2-dr1-rass-inputs-v1
      - name: Match the release catalogues and offset skies
        run: |
          pip install -r "$STUDY/requirements.txt"
          mkdir -p "$OUT"
          if [[ "$REFRESH" != true && -f "$OUT/catalog.sha256" ]] && sha256sum -c "$OUT/catalog.sha256"; then
            echo "Reusing verified catalogue comparison"
          else
            python "$STUDY/catalogs.py" --work work --out "$OUT"
            sha256sum "$STUDY/catalogs.py" "$STUDY/requirements.txt" "$OUT/catalog_sources.csv.gz" "$OUT/spectral_model.json" > "$OUT/catalog.sha256"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 01-catalog
          path: |
            results/xmmsl2-erass1-rass/outputs/catalog*
            results/xmmsl2-erass1-rass/outputs/spectral_model.json
            results/xmmsl2-erass1-rass/outputs/shifted_controls.json
          if-no-files-found: warn
  associations:
    needs: maps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/xmmsl2-erass1-rass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: 02-maps
          path: results/xmmsl2-erass1-rass/outputs
      - name: Read published optical and infrared identifications and the hard-band catalogue
        run: |
          pip install -r "$STUDY/requirements.txt"
          python "$STUDY/counterparts.py" "$OUT"
          python "$STUDY/local_hosts.py" "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: 04-published-hosts
          path: results/xmmsl2-erass1-rass/outputs/published_hosts
  maps:
    permissions:
      contents: read
      actions: read
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/xmmsl2-erass1-rass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: 01-catalog
          path: results/xmmsl2-erass1-rass/outputs
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: 02-maps
          path: work/first-reduction
          run-id: '44990857228'
          github-token: ${{ github.token }}
      - name: Measure local limits and compare three epochs
        run: |
          pip install -r "$STUDY/requirements.txt"
          if [[ "$REFRESH" != true && -f "$OUT/maps.sha256" ]] && sha256sum -c "$OUT/maps.sha256"; then
            echo "Reusing verified map measurements"
          else
            python "$STUDY/limits.py" --work work --out "$OUT"
            sha256sum "$STUDY/limits.py" "$OUT/catalog.sha256" "$OUT/limits.csv" > "$OUT/maps.sha256"
          fi
          python "$STUDY/prepare.py" "$OUT"
          python "$STUDY/map_qa.py" "$OUT" --earlier work/first-reduction
          python "$STUDY/controls.py" "$OUT"
          python "$STUDY/full_only_review.py" --out "$OUT" --work work
          python "$STUDY/spectral_stress.py" --out "$OUT" --work work
          python "$STUDY/rass_legacy.py" --work work --out "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 02-maps
          path: |
            results/xmmsl2-erass1-rass/outputs/limit*
            results/xmmsl2-erass1-rass/outputs/ero_ul_queries.jsonl.gz
            results/xmmsl2-erass1-rass/outputs/positive_controls.csv
            results/xmmsl2-erass1-rass/outputs/full_only_review*
            results/xmmsl2-erass1-rass/outputs/spectral_stress*
            results/xmmsl2-erass1-rass/outputs/rass_legacy*
            results/xmmsl2-erass1-rass/outputs/maps.sha256
            results/xmmsl2-erass1-rass/outputs/comparisons.csv.gz
            results/xmmsl2-erass1-rass/outputs/input.csv
          if-no-files-found: warn
  vet:
    needs: [maps, associations]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/xmmsl2-erass1-rass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: '0[12]-*'
          merge-multiple: true
          path: results/xmmsl2-erass1-rass/outputs
      - uses: actions/download-artifact@v4
        with:
          name: 04-published-hosts
          path: results/xmmsl2-erass1-rass/outputs/published_hosts
      - name: Resolve counterparts and prior reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -r "$STUDY/requirements.txt"
          python "$STUDY/vet.py" "$OUT/input.csv" "$OUT/vetting"
          python "$STUDY/history.py" "$OUT"
          python "$STUDY/casework.py" "$OUT"
          python "$STUDY/casework.py" "$OUT" --historical
          python "$STUDY/report.py" "$OUT"
          python "$STUDY/host_adjudication.py" --out "$OUT" --work work
          python "$STUDY/independent_epochs.py" "$OUT" --work work
          python "$STUDY/survey_plot.py" "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 03-vetting
          path: |
            results/xmmsl2-erass1-rass/outputs/vetting
            results/xmmsl2-erass1-rass/outputs/event_history
            results/xmmsl2-erass1-rass/outputs/casework
            results/xmmsl2-erass1-rass/outputs/review*
            results/xmmsl2-erass1-rass/outputs/candidates*
            results/xmmsl2-erass1-rass/outputs/host_adjudication*
            results/xmmsl2-erass1-rass/outputs/summary*
            results/xmmsl2-erass1-rass/outputs/survey-comparison.png
          if-no-files-found: warn
  record:
    needs: [catalog, maps, associations, vet]
    if: always() && !cancelled() && github.ref == 'refs/heads/survey/xmmsl2-erass1-rass'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: survey/xmmsl2-erass1-rass
      - uses: actions/download-artifact@v4
        with:
          pattern: '0*'
          path: products
      - name: Record survey evidence on the research branch
        run: |
          mkdir -p "$OUT"
          for bundle in products/*; do
            [[ -d "$bundle" ]] || continue
            dest="$OUT"
            if [[ "$bundle" == */04-published-hosts ]]; then dest="$OUT/published_hosts"; fi
            mkdir -p "$dest"
            cp -a "$bundle/." "$dest/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "Record three-survey measurements and source-level dispositions (run $GITHUB_RUN_ID)"
            git push origin HEAD:survey/xmmsl2-erass1-rass
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the branch
        run: |
          python -m pip install '.[archive]' numpy pandas scipy matplotlib
          python -m open_space.verify
          python -m unittest discover -s tests
