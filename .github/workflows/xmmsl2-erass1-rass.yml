name: XMM slew transients across three surveys
on:
  workflow_dispatch:
  push:
    branches: ['survey/xmmsl2-erass1-rass']
    paths: ['.github/workflows/xmmsl2-erass1-rass.yml']
permissions:
  contents: read
concurrency:
  group: xmmsl2-erass1-rass-${{ github.ref }}
  cancel-in-progress: false
env:
  STUDY: results/xmmsl2-erass1-rass
  OUT: results/xmmsl2-erass1-rass/outputs
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: results/xmmsl2-erass1-rass
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r "$STUDY/requirements.txt"
      - name: Test counterpart services and check the published associations
        run: |
          python -u "$STUDY/service_check.py" &
          refs=$!
          python -u "$STUDY/history.py" "$OUT" &
          tdes=$!
          python -u "$STUDY/counterparts.py" "$OUT" &
          counterparts=$!
          python -u "$STUDY/rass_legacy.py" --work work --out "$OUT"
          python "$STUDY/controls.py" "$OUT"
          wait "$refs"
          wait "$tdes"
          wait "$counterparts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-audit
          path: |
            results/xmmsl2-erass1-rass/outputs/service_audit
            results/xmmsl2-erass1-rass/outputs/event_history
            results/xmmsl2-erass1-rass/outputs/published_hosts
            results/xmmsl2-erass1-rass/outputs/positive_controls.csv
            results/xmmsl2-erass1-rass/outputs/rass_legacy*
  record:
    if: always() && !cancelled() && github.ref == 'refs/heads/survey/xmmsl2-erass1-rass'
    needs: reference
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: survey/xmmsl2-erass1-rass
          sparse-checkout: results/xmmsl2-erass1-rass
      - uses: actions/download-artifact@v4
        with:
          name: reference-audit
          path: results/xmmsl2-erass1-rass/outputs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "Record optical archive recovery, published identifications and earlier ROSAT detections"
            git push origin HEAD:survey/xmmsl2-erass1-rass
          fi
