name: XMM slew transients across three surveys
on:
  workflow_dispatch:
  push:
    branches: ['survey/xmmsl2-erass1-rass']
    paths: ['.github/workflows/xmmsl2-erass1-rass.yml']
permissions:
  contents: read
concurrency:
  group: xmmsl2-erass1-rass-${{ github.ref }}
  cancel-in-progress: false
env:
  STUDY: results/xmmsl2-erass1-rass
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/xmmsl2-erass1-rass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare the FITS reader
        run: pip install 'astropy>=6,<8' requests
      - uses: actions/cache@v4
        with:
          path: work/downloads
          key: xmmsl2-dr1-rass-inputs-v1
      - name: Freeze versioned survey files and inspect their original fields
        run: python -u "$STUDY/release_check.py"
      - uses: actions/upload-artifact@v4
        with:
          name: survey-release-headers
          path: results/xmmsl2-erass1-rass/release
          if-no-files-found: error
  record:
    needs: inventory
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: survey/xmmsl2-erass1-rass
          sparse-checkout: results/xmmsl2-erass1-rass
      - uses: actions/download-artifact@v4
        with:
          name: survey-release-headers
          path: results/xmmsl2-erass1-rass/release
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$STUDY/release"
          if ! git diff --cached --quiet; then
            git commit -m "Record official release products, checksums and column definitions"
            git push origin HEAD:survey/xmmsl2-erass1-rass
          fi
