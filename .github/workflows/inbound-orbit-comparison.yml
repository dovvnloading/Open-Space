name: Inbound orbit comparison
on:
  push:
    branches: ['research/inbound-hyperbolic-search']
    paths:
      - 'results/inbound-hyperbolic-search/comparison/screen.py'
      - '.github/workflows/inbound-orbit-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: results/inbound-hyperbolic-search
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/inbound-hyperbolic-search
      - run: python comparison/screen.py comparison/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: comparison
          path: results/inbound-hyperbolic-search/comparison/evidence
