name: GALAH DR4 PISN catalog screen
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'results/galah-dr4-pisn-fingerprint/**'
      - '.github/workflows/galah-dr4-pisn.yml'
permissions:
  contents: write
jobs:
  full-official-catalogue:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/galah-dr4-pisn-fingerprint'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install astronomical FITS reader and numerical runtime
        run: python -m pip install 'numpy>=1.26,<3' 'astropy>=6,<9'
      - name: Fetch and hash official DR4 FITS, scan frozen criteria, measure injection sensitivity
        id: scan
        continue-on-error: true
        run: |
          python results/galah-dr4-pisn-fingerprint/screen.py \
            --cache "$RUNNER_TEMP/galah_dr4_allstar_240705.fits" \
            --out "results/galah-dr4-pisn-fingerprint/run"
      - name: Deposit receipts to dedicated research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/galah-dr4-pisn-fingerprint/run/
          if ! git diff --cached --quiet; then
            git commit -m "research: deposit hashed GALAH DR4 full-catalogue scan receipt"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galah-dr4-pisn-receipt
          path: results/galah-dr4-pisn-fingerprint/run/
          if-no-files-found: warn
      - name: Require completed catalogue scan
        if: steps.scan.outcome != 'success'
        run: exit 1
