name: KM3-230213A public transient counterpart audit
on:
  push:
    branches: [research/km3-230213a-counterparts]
    paths:
      - 'results/km3-230213a-counterparts/analysis.py'
      - 'results/km3-230213a-counterparts/known_17.csv'
      - 'results/km3-230213a-counterparts/swift_grb.py'
      - '.github/workflows/km3-230213a-crossmatch.yml'
  workflow_dispatch:
concurrency:
  group: km3-230213a-evidence
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  crossmatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/km3-230213a-counterparts
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit event, replay published candidates, and retrieve fresh TNS and CHIME catalogs
        run: python results/km3-230213a-counterparts/analysis.py
      - name: Independently screen NASA Swift GRB archive with registered 1-day window
        run: python results/km3-230213a-counterparts/swift_grb.py
      - name: Replay fixed-input statistical validation and write compact receipts
        run: |
          python results/km3-230213a-counterparts/referee.py
      - name: Fingerprint source and result records with SHA-256
        working-directory: results/km3-230213a-counterparts
        run: |
          sha256sum analysis.py referee.py swift_grb.py swift_grb_matches.csv swift_grb_receipt.json known_17.csv known_replay.csv PUBLISHED_BASELINE.md new_associations.csv retrieval_receipts.json control_statistics.json referee_results.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Commit hashes and derived results to this branch
        run: |
          git add results/km3-230213a-counterparts/SHA256SUMS results/km3-230213a-counterparts/swift_grb_matches.csv results/km3-230213a-counterparts/swift_grb_receipt.json results/km3-230213a-counterparts/known_replay.csv results/km3-230213a-counterparts/new_associations.csv results/km3-230213a-counterparts/retrieval_receipts.json results/km3-230213a-counterparts/control_statistics.json results/km3-230213a-counterparts/referee_results.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'research(km3): archive released-catalogue audit, controls and receipt digests'
            # The research branch may have moved after this run checked out.
            # Rebase the output-only commit onto the latest head, never force-push.
            for attempt in 1 2 3; do
              git fetch origin research/km3-230213a-counterparts
              git rebase origin/research/km3-230213a-counterparts
              if git push origin HEAD:research/km3-230213a-counterparts; then break; fi
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: km3-230213a-transient-catalogue-evidence
          path: |
            results/km3-230213a-counterparts/swift_grb_matches.csv
            results/km3-230213a-counterparts/swift_grb_receipt.json
            results/km3-230213a-counterparts/SHA256SUMS
            results/km3-230213a-counterparts/known_replay.csv
            results/km3-230213a-counterparts/new_associations.csv
            results/km3-230213a-counterparts/retrieval_receipts.json
            results/km3-230213a-counterparts/control_statistics.json
            results/km3-230213a-counterparts/referee_results.json
