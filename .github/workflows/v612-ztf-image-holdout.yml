name: V612 Scuti image-level holdout
on:
  push:
    branches: [research/v612-scuti-optical-clock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas
      - run: python results/v612-sct-clock/followup/ztf_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: v612-ztf-images
          path: /tmp/v612-ztf-images
          retention-days: 30
          if-no-files-found: error
