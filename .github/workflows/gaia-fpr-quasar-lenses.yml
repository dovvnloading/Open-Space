name: Gaia FPR quasar lens search

on:
  workflow_dispatch:
    inputs:
      fresh_pixels:
        description: Fetch new stamp bytes even when identical prior fits are available
        type: boolean
        default: false
  push:
    branches: [research/gaia-fpr-quasar-lenses]
    paths: ['.github/workflows/gaia-fpr-quasar-lenses.yml']

permissions:
  contents: read

concurrency:
  group: gaia-fpr-quasar-lenses
  cancel-in-progress: false

env:
  STUDY: results/gaia-fpr-quasar-lenses
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  FRESH_PIXELS: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_pixels || 'false' }}

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/gaia-fpr-quasar-lenses
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up the Gaia runner
        run: |
          echo "GAIA_CACHE=$RUNNER_TEMP/gaia-fpr-inputs" >> "$GITHUB_ENV"
          pip install -r "$STUDY/requirements.txt"
      - uses: actions/cache/restore@v4
        id: input-cache
        with:
          path: ${{ runner.temp }}/gaia-fpr-inputs
          key: gaia-fpr-I361-v1
      - name: Retrieve immutable FPR catalogue
        run: python "$STUDY/fetch_fpr.py"
      - uses: actions/cache/save@v4
        if: steps.input-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/gaia-fpr-inputs
          key: gaia-fpr-I361-v1
      - name: Apply identical colour and astrometric cuts in targeted and random apertures
        run: |
          python -u "$STUDY/gaia.py" "$RUNNER_TEMP/selection"
          GAIA_GEOMETRY=wide python -u "$STUDY/gaia.py" "$RUNNER_TEMP/selection/wide"
      - name: Include FPR input receipts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/selection"
          cp "$STUDY/evidence/fpr-downloads.json" "$RUNNER_TEMP/selection/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaia-selection
          path: ${{ runner.temp }}/selection
          if-no-files-found: error
  catalogues:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/gaia-fpr-quasar-lenses
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the publication and known-lens control lists
        run: |
          pip install -r "$STUDY/requirements.txt"
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          python -u "$STUDY/study.py" catalogues "$RUNNER_TEMP/catalogues"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaia-catalogues
          path: ${{ runner.temp }}/catalogues
          if-no-files-found: error
  adjudicate:
    needs: [selection, catalogues]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/gaia-fpr-quasar-lenses
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: gaia-*
          merge-multiple: true
          path: ${{ runner.temp }}/science
      - name: Compare spectra, fit pixels and model lenses
        run: |
          pip install -r "$STUDY/requirements.txt"
          python -u "$STUDY/study.py" inspect "$RUNNER_TEMP/science"
          python -u "$STUDY/study.py" summarize "$RUNNER_TEMP/science"
          python "$STUDY/audit.py" "$RUNNER_TEMP/science"
          python "$STUDY/audit.py" "$RUNNER_TEMP/science/wide"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-evidence
          path: ${{ runner.temp }}/science
          if-no-files-found: error
  publish:
    needs: [selection, catalogues, adjudicate]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/research/gaia-fpr-quasar-lenses' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/gaia-fpr-quasar-lenses
      - uses: actions/download-artifact@v4
        with:
          pattern: gaia-*
          merge-multiple: true
          path: ${{ runner.temp }}/persist
      - uses: actions/download-artifact@v4
        if: needs.adjudicate.result != 'skipped'
        with:
          name: final-evidence
          path: ${{ runner.temp }}/persist
      - name: Commit study outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$STUDY/evidence"
          if [ "${{ needs.adjudicate.result }}" = success ]; then
            rsync -a --delete "$RUNNER_TEMP/persist/" "$STUDY/evidence/"
          else
            rsync -a "$RUNNER_TEMP/persist/" "$STUDY/evidence/"
          fi
          git add -f -- "$STUDY/evidence"
          if ! git diff --cached --quiet; then
            git commit -m "Record Gaia FPR evidence from run $GITHUB_RUN_ID"
            git push origin HEAD:refs/heads/research/gaia-fpr-quasar-lenses
          fi
      - name: Verify the resulting branch
        run: |
          python -m open_space.verify
          python -m unittest discover -s tests
