name: SPHEREx blind catalog classifications
on:
  push:
    branches: [research/spherex-waste-heat]
    paths:
      - .github/workflows/spherex-blind-classifications.yml
      - results/spherex-waste-heat/blind/classify.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  classify:
    if: github.ref == 'refs/heads/research/spherex-waste-heat'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: archive-blind
          run-id: '44025746210'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blind-inputs
      - run: python -m pip install 'numpy>=2' astropy requests
      - name: Match the measured cohort
        run: python results/spherex-waste-heat/blind/classify.py "$RUNNER_TEMP/blind-inputs/blind"
      - name: Save per-star classifications and receipts
        run: |
          set -euo pipefail
          study=results/spherex-waste-heat/blind/classifications
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$study"
          if ! git diff --cached --quiet; then
            git commit -m 'Record catalog classifications of the frozen blind cohort'
            for attempt in 1 2 3; do
              git fetch origin research/spherex-waste-heat
              git rebase FETCH_HEAD
              if git push origin HEAD:research/spherex-waste-heat; then break; fi
              if [ "$attempt" = '3' ]; then exit 1; fi
              sleep 3
            done
          fi
          python -c "import json; assert json.load(open('$study/counts.json'))['complete'], 'Check included partial receipts'"
