name: Sector 105 eclipse and field replay
on:
  push:
    branches: ["research/tess-asymmetric-dips"]
    paths: [".github/workflows/tess-asymmetric-dips-replay.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: results/tess-asymmetric-dips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Remeasure every held-out trigger on the full-frame pixels
        run: OPENBLAS_NUM_THREADS=1 python pixels.py confirmation/triggers.csv /tmp/replay-pixels.json
      - name: Remeasure simultaneous flux in the six local comparison stars
        run: OPENBLAS_NUM_THREADS=1 python neighbors.py confirmation/triggers.csv sample.json /tmp/replay-neighbors.json
      - name: Verify count, sign and amplitude of independent re-extractions
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, textwrap
          p=json.loads(pathlib.Path('/tmp/replay-pixels.json').read_bytes())
          n=json.loads(pathlib.Path('/tmp/replay-neighbors.json').read_bytes())
          assert len(p)==39 and sum(len(x['events']) for x in p)==65
          assert len(n)==234 and all(x['status']=='ok' for x in p+n)
          lead=next(e for s in p if str(s['tic'])=='316937197' for e in s['events'] if e['peak_btjd']>4217)
          assert abs(lead['aperture_fractional_depth']-.007055)<.001
          for name in ('pixels','neighbors'):
              data=pathlib.Path('/tmp/replay-'+name+'.json').read_bytes()
              print(name, 'SHA-256', hashlib.sha256(data).hexdigest())
              payload=base64.b64encode(gzip.compress(data,mtime=0)).decode('ascii')
              for i,part in enumerate(textwrap.wrap(payload,2000)):
                  print('REC',name,i,part)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sector105-field-replay
          path: /tmp/replay-*.json
