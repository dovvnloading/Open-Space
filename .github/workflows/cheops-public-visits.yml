name: CHEOPS public visit transit search
on:
  workflow_dispatch:
  push:
    branches: ['research/cheops-public-visit-search']
    paths: ['.github/workflows/cheops-public-visits.yml']
permissions:
  contents: read
concurrency:
  group: cheops-public-visit-search
  cancel-in-progress: false
env:
  STUDY: results/cheops-public-visits
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  archive:
    if: github.ref == 'refs/heads/research/cheops-public-visit-search' && github.run_number <= 3 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/cheops-public-visits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch visit listings and verify anonymous photometry access
        run: |
          python -m pip install -r "$STUDY/requirements.txt" > "$RUNNER_TEMP/install.log"
          python "$STUDY/archive_io.py" inventory "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: cheops-archive
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: cheops-archive
          path: results/cheops-public-visits/outputs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record the result and input receipts
        run: |
          python "$STUDY/publish.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$STUDY/outputs" "$STUDY/README.md" README.md
          git commit -m 'Record anonymous CHEOPS archive access and input receipts'
          git push origin HEAD:refs/heads/research/cheops-public-visit-search
      - name: Verify deposited repository
        run: |
          python -m open_space.verify > "$RUNNER_TEMP/verify.log" || { tail -60 "$RUNNER_TEMP/verify.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/verify.log"
      - name: Run repository tests
        if: success() || failure()
        run: |
          python -m pip install -r "$STUDY/requirements.txt" scipy pandas > "$RUNNER_TEMP/test-deps.log"
          python -m unittest discover -s tests
