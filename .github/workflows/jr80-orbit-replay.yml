name: JR80 orbit and archive replay
on:
  pull_request:
    paths:
      - 'results/rubin-jr80-mutual-motion/**'
      - '.github/workflows/jr80-orbit-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: results/rubin-jr80-mutual-motion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy scipy astropy
      - name: Verify frozen catalogs, cutouts and archive checksum reader
        run: |
          python verify_data.py
          python cutouts.py
          python stellar_sample.py
          python - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "archive")
          from replay import file_checksum
          data = Path("data")
          hashes = json.loads((data / "provenance.json").read_text())["frozen_sha256"]
          for name, expected in hashes.items():
              assert file_checksum(data / name, "sha256") == expected, name
          sample = data / "target.csv"
          assert file_checksum(sample, "md5") == hashlib.md5(sample.read_bytes()).hexdigest()
          PY
      - name: Replay frozen forecasts, final-fit residuals and the excluded CFHT epoch
        run: |
          python orbit/historical_predictions.py
          python orbit/validate_blind.py | diff - orbit/blind_residuals.csv
          python orbit/validate_blind.py --final-fit | diff - orbit/final_decam_residuals.csv
          python orbit/excluded_cfht.py | diff - orbit/excluded_cfht.csv
