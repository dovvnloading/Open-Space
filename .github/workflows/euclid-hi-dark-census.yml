name: Euclid blind-HI all-beam S3/HATS follow-up (one networked job)
on:
  push:
    branches:
      - research/euclid-hi-dark-census
    paths:
      - 'results/euclid-hi-dark-census/beam_followup.py'
      - 'results/euclid-hi-dark-census/beam_referee.py'
      - 'results/euclid-hi-dark-census/run.py'
      - 'results/euclid-hi-dark-census/freeze.json'
      - 'results/euclid-hi-dark-census/tests.py'
      - '.github/workflows/euclid-hi-dark-census.yml'
      - '!results/euclid-hi-dark-census/output/**'
      - '!results/euclid-hi-dark-census/README.md'
      - '!results/euclid-hi-dark-census/REFEREE.md'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: euclid-hi-dark-census
  cancel-in-progress: false
jobs:
  acquire-crossmatch-referee:
    if: github.ref == 'refs/heads/research/euclid-hi-dark-census'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public S3 HATS and FITS range readers
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3' 'astropy>=6,<9' 'scipy>=1.12,<2' 'fsspec>=2025' 's3fs>=2025' 'pyarrow>=20' 'lsdb>=0.7'
          python -m py_compile results/euclid-hi-dark-census/{beam_followup,beam_referee,run}.py
      - name: Checkpoint source-derived batches and referee without retriggering on output paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src=results/euclid-hi-dark-census
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit_batch() {
            git add -f "$src/output/beam_batches" "$src/output/beam_followup_status.json" "$src/output/full_beam_referee.json"
            git add "$src/README.md" "$src/REFEREE.md" README.md
            if ! git diff --cached --quiet; then
              git commit -m 'research(hi): checkpoint all-beam source receipts and referee'
              # A concurrent documentation commit can advance the branch during a batch.
              # Rebase the checkpoint commit instead of failing a non-fast-forward push.
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          }
          if [[ ! -s "$src/output/footprint_hits.csv" ]]; then
            echo 'Missing prior frozen 1375-beam inventory' >&2
            exit 1
          fi
          started=$(date +%s)
          budget=18300
          while (( $(date +%s) - started < budget )); do
            python -u "$src/beam_followup.py" --batch-size 8
            python -u "$src/beam_referee.py"
            commit_batch
            finished=$(python -c 'import json; print(int(json.load(open("results/euclid-hi-dark-census/output/beam_followup_status.json"))["complete"]))')
            if [[ "$finished" == 1 ]]; then
              echo "All 1375 entry-level source checks recorded; physical review still controls validation."
              exit 0
            fi
          done
          echo "Run budget elapsed; batches safely committed, requesting continuation."
          gh workflow run euclid-hi-dark-census.yml --ref "$GITHUB_REF_NAME" || {
            echo "Workflow-dispatch unavailable: source-path push required for next run" >&2
          }
      - name: Archive receipts, also on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euclid-hi-all-beam-receipts
          path: results/euclid-hi-dark-census/output/
          retention-days: 30
          if-no-files-found: warn
