name: JWST nearby-star FITS referee replay
on:
  push:
    branches:
      - research/jwst-nearby-companions
    paths:
      - 'results/jwst-nearby-companions/referee_pixel_replay.py'
      - '.github/workflows/jwst-nearby-fits-referee.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fits-referee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [spitzer, g29, nircam, gj205]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reduction packages
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'astropy>=5.3,<8' pandas matplotlib
      - name: Compile image-reduction scripts
        run: python -m compileall -q results/jwst-nearby-companions
      - name: Redownload SHA-pinned pixels and independently replay case
        run: python results/jwst-nearby-companions/referee_pixel_replay.py "${{ matrix.case }}" "/tmp/jwst-nearby-referee"
