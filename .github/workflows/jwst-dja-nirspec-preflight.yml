name: JWST DJA NIRSpec high-z preflight

on:
  pull_request:
    paths:
      - "results/jwst-dja-nirspec-highz-screen/**"
      - ".github/workflows/jwst-dja-nirspec-preflight.yml"
      - "README.md"
  push:
    branches:
      - "research/jwst-dja-nirspec-highz-screen"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the new source
        run: python -m compileall -q results/jwst-dja-nirspec-highz-screen
      - name: Check frozen release and explicit missing-evidence status
        run: python results/jwst-dja-nirspec-highz-screen/verify_preflight.py
      - name: Install numerical dependencies for synthetic invariant test
        run: python -m pip install numpy scipy
      - name: Reproduce synthetic numerical model invariants, NOT astrophysical detection
        run: python results/jwst-dja-nirspec-highz-screen/screen.py --self-test
      - name: Check fail-closed high-z candidate review gate
        run: python results/jwst-dja-nirspec-highz-screen/candidate_gate.py --self-test
      - name: Check repository links and number claims
        run: python -m open_space.verify --worktree
