name: Independent occultation and frequency holdouts
on:
  pull_request:
  push:
    branches:
      - research/independent-archive-findings
jobs:
  independent-research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install independent semi-analytic ephemeris
        run: python -m pip install 'pyswisseph==2.10.3.2'
      - name: Freeze-test four independent B1822 radio channels and time controls
        run: python results/pulsar-brightness-delays/cross_frequency_holdout.py > /tmp/independent-b1822.json
      - name: Freeze-test Moshier ephemeris and radio site visibility
        run: python results/venus-psr-j1813-2113/independent_validation.py > /tmp/independent-venus.json
