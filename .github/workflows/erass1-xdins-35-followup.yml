name: eRASS1 top-35 INS image and archive referee (branch only)
on:
  push:
    branches:
      - research/erass1-top35-ins-referee-20261119
    paths:
      - 'results/erass1-xdins-35-referee/run.py'
      - 'results/erass1-xdins-35-referee/requirements.txt'
      # Explicitly no output/**, README, or pull_request trigger.
permissions:
  contents: write
jobs:
  data-and-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned packages
        run: python -m pip install -r results/erass1-xdins-35-referee/requirements.txt
      - name: Fetch image pixels and archives, compute 35-source evidence
        run: python results/erass1-xdins-35-referee/run.py
      - name: Commit generated evidence together (not retriggered)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/erass1-xdins-35-referee/output/
          if ! git diff --cached --quiet; then
            git commit -m "Record eRASS1 top-35 forced-position image and archival evidence"
            git push origin HEAD:research/erass1-top35-ins-referee-20261119
          fi
