name: Independent NASA PDS original-KP 2025 Aug 24 flux crosscheck
on:
  push:
    branches:
      - research/mex-vmc-2025h2-atmosphere-20261115
    paths:
      - examples/maven_pds_kp_primary_audit.py
      - tests/test_maven_pds_kp_primary_audit.py
      - .github/workflows/maven-pds-kp-primary-audit.yml
  workflow_dispatch:
permissions:
  contents: write

jobs:
  original-pds-kp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exactly specified primary validation environment
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0
      - name: Test PDS4 primary label and decoder against a miniature independent fixture
        run: python -m unittest discover -s tests -p test_maven_pds_kp_primary_audit.py -v
      - name: Retrieve official NASA PDS4 Aug 24 v26 KP and verify published MD5, compare all 16 SEP+error fields
        run: python examples/maven_pds_kp_primary_audit.py --output results/maven-2025-sep-events/primary_pds_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: maven-2025-08-24-primary-nasa-kp-pds4-receipt
          path: results/maven-2025-sep-events/primary_pds_audit.json
          if-no-files-found: error
      - name: Push validated primary NASA archive digests and per-channel comparison ONLY after checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/mex-vmc-2025h2-atmosphere-20261115'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/maven-2025-sep-events/primary_pds_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify Aug 24 MAVEN SEP amplitudes against original MD5-pinned NASA PDS4 KP file'
            git pull --rebase origin research/mex-vmc-2025h2-atmosphere-20261115
            git push origin HEAD:research/mex-vmc-2025h2-atmosphere-20261115
          fi
