name: SPHEREx waste-heat measurement replay
on:
  push:
    branches: [research/spherex-waste-heat]
    paths: [.github/workflows/spherex-waste-heat-replay.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spherex-waste-heat-archive-replay
  cancel-in-progress: false

jobs:
  wise:
    if: github.ref == 'refs/heads/research/spherex-waste-heat'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/spherex-waste-heat
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy matplotlib pillow
      - name: Fetch public AllWISE, CatWISE, unWISE and final-year NEOWISE
        working-directory: results/spherex-waste-heat
        run: |
          python wise/fetch.py --workers 5 --output wise/archive
          python wise/measure.py --archive wise/archive --output wise/generated
          cp wise/generated/*.csv wise/generated/queries.json wise/
      - name: Preserve inputs, measured visits and selection counts
        working-directory: results/spherex-waste-heat
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, gzip, hashlib, json, zipfile
          w = Path("wise")
          receipts = json.loads((w/"queries.json").read_text())
          assert len(receipts) == 40
          assert len(list(csv.DictReader((w/"catalog_photometry.csv").open()))) == 10
          with zipfile.ZipFile(w/"archive_inputs.zip", "w", compression=zipfile.ZIP_DEFLATED) as z:
              for k, rec in sorted(receipts.items()):
                  f = w/"archive"/(k+".csv.gz")
                  assert hashlib.sha256(gzip.decompress(f.read_bytes())).hexdigest() == rec["sha256"]
                  z.write(f, f.name)
                  j = f.with_name(k+".json")
                  z.write(j, j.name)
          PY
          git add wise/queries.json wise/catalog_photometry.csv wise/visits.csv wise/variability.csv wise/archive_inputs.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Archive WISE source queries and measured final-year visits'
            git fetch origin research/spherex-waste-heat
            git rebase FETCH_HEAD
            git push origin HEAD:research/spherex-waste-heat
          fi
      - name: Archive replay tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spherex-wise-replay
          path: |
            results/spherex-waste-heat/wise/archive/
            results/spherex-waste-heat/wise/*.csv
            results/spherex-waste-heat/wise/queries.json
