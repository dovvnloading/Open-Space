name: Public Rubin visit footprint check
on:
  push:
    branches: ['research/inbound-hyperbolic-search']
    paths: ['results/inbound-hyperbolic-search/catalog/rubin_visits.py']
permissions:
  contents: read
jobs:
  footprints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/inbound-hyperbolic-search/catalog
      - run: |
          cd results/inbound-hyperbolic-search/catalog
          python rubin_visits.py
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          for path in Path('image-search').glob('rubin-*'):
              data=base64.b64encode(gzip.compress(path.read_bytes(),mtime=0)).decode()
              for i in range(0,len(data),4000):
                  print('RUBINFILE',path.name,i,data[i:i+4000])
          PY
