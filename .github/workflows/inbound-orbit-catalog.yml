name: Inbound orbit search replay
on:
  push:
    branches: ['research/inbound-hyperbolic-search']
    paths:
      - 'results/inbound-hyperbolic-search/catalog/audit.py'
      - '.github/workflows/inbound-orbit-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: results/inbound-hyperbolic-search
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/inbound-hyperbolic-search
      - uses: actions/download-artifact@v4
        with:
          name: catalog-audit
          run-id: 44024557239
          github-token: ${{ github.token }}
          path: original-snapshot
      - run: |
          cp "$GITHUB_WORKSPACE/original-snapshot/"{sbdb.json.gz,receipt.json} catalog/
          python catalog/audit.py catalog
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in ['sbdb.json.gz','receipt.json','summary.json']:
              data = base64.b64encode((Path('catalog')/name).read_bytes()).decode()
              for pos in range(0,len(data),4000):
                  print('EXPORT', name, pos, data[pos:pos+4000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-audit
          path: results/inbound-hyperbolic-search/catalog
