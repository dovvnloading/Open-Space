name: Inbound orbit search replay
on:
  push:
    branches: ['research/inbound-hyperbolic-search']
    paths:
      - 'results/inbound-hyperbolic-search/catalog/*.py'
      - '.github/workflows/inbound-orbit-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: results/inbound-hyperbolic-search
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/inbound-hyperbolic-search
      - run: python catalog/audit.py catalog
      - run: python catalog/archives.py catalog/image-search
      - run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          for path in sorted(Path('catalog/image-search').glob('*')):
              body = base64.b64encode(gzip.compress(path.read_bytes(),mtime=0)).decode()
              for i in range(0,len(body),4000):
                  print('ARCHIVE',path.name,i,body[i:i+4000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-audit
          path: results/inbound-hyperbolic-search/catalog
