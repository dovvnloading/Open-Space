name: Validate October 27 image quality and static subtraction
on:
  push:
    branches: ['research/inbound-hyperbolic-search']
    paths: ['results/inbound-hyperbolic-search/catalog/image-search/stack/stack.py','.github/workflows/inbound-orbit-catalog.yml']
permissions:
  contents: read
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: results/inbound-hyperbolic-search/catalog
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: results/inbound-hyperbolic-search/catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 astropy==7.1.0
      - run: python image-search/stack/stack.py image-search --quality-oct27
      - run: python image-search/stack/stack.py image-search --quality-oct27 --science-pairs
      - name: Report stack results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          for path in Path('image-search').glob('quality-*/*.json'):
              body = base64.b64encode(gzip.compress(path.read_bytes(), mtime=0)).decode()
              for i in range(0,len(body),4000):
                  print('QUALITYFILE',str(path.relative_to('image-search')),i,body[i:i+4000])
          PY
