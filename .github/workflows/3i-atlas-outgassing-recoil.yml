name: 3I ATLAS full-arc orbit and measured gas recoil
on:
  push:
    branches:
      - research/3i-atlas-outgassing-recoil
    paths:
      - 'results/3i-atlas-outgassing-recoil/**'
      - '!results/3i-atlas-outgassing-recoil/generated/**'
      - '!results/3i-atlas-outgassing-recoil/README.md'
      - '!results/3i-atlas-outgassing-recoil/REFEREE.md'
      - '!results/3i-atlas-outgassing-recoil/SOURCES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3i-recoil-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orbit-and-recoil:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install orbit and vector-recoil dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy jplephem pyerfa
      - name: Fetch MPC and SBDB data and kernel; independently fit and calculate recoil
        run: python results/3i-atlas-outgassing-recoil/run.py
      - name: Commit all generated evidence in one batch without retriggering
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results/3i-atlas-outgassing-recoil/generated
          if ! git diff --cached --quiet; then
            git commit -m "Archive 3I MPC orbit and gas-recoil evidence [skip ci]"
            git push origin HEAD:research/3i-atlas-outgassing-recoil
          fi
      - name: Render compact run receipt
        if: always()
        shell: bash
        run: |
          echo "## 3I/ATLAS orbit and recoil" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/3i-atlas-outgassing-recoil/generated/REPORT.md ]; then
            head -n 22 results/3i-atlas-outgassing-recoil/generated/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed report; examine committed receipts and job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
