name: Bounded 4XMM DR14 QPE archive screen

on:
  push:
    branches:
      - research/xmm-qpe-dr14
    paths:
      - 'results/xmm-qpe-dr14/**'
      - '!results/xmm-qpe-dr14/outputs/**'
      # Documentation-only updates cannot change the frozen data run.
      - '!results/xmm-qpe-dr14/README.md'
      - '!results/xmm-qpe-dr14/REFEREE.md'

permissions:
  contents: write

concurrency:
  group: xmm-qpe-dr14-bounded-screen
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 astropy==7.0.1 scipy==1.15.3 requests==2.32.5
      - name: Download fixed data and compute scientific checks
        run: python results/xmm-qpe-dr14/search.py
      - name: Commit receipts and results as a single batch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/xmm-qpe-dr14/outputs/
          if ! git diff --cached --quiet; then
            git commit -m "Record DR14 QPE archive run receipts, freeze and control checks [skip ci]"
            git push origin HEAD:research/xmm-qpe-dr14
          fi
