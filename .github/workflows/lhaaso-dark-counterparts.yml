name: 1LHAASO dark-source catalogue census
on:
  push:
    branches: [research/lhaaso-dark-counterparts]
    paths:
      - 'results/lhaaso-dark-counterparts/**'
      - '!results/lhaaso-dark-counterparts/output/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lhaaso-dark-census-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-catalogues-and-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/lhaaso-dark-counterparts
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-catalogue and numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 astropy==6.1.7 requests==2.32.3 psrqpy==1.3.2
      - name: Retrieve and checksum original published catalogue and public counterpart catalogues
        run: python results/lhaaso-dark-counterparts/pipeline.py
      - name: Run source-resolved latitude-matched controls and energetic plausibility checks
        run: python results/lhaaso-dark-counterparts/controls.py
      - name: Independent file and inference audit; produce finite-claim report
        run: python results/lhaaso-dark-counterparts/referee.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhaaso-dark-counterparts-evidence
          path: results/lhaaso-dark-counterparts/output/
          if-no-files-found: warn
          retention-days: 60
      - name: Commit validated output in bounded batches (no self-trigger loop)
        if: success() && github.ref == 'refs/heads/research/lhaaso-dark-counterparts'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=results/lhaaso-dark-counterparts/output
          git add "$base/frozen/" "$base/catalogs/"
          if ! git diff --cached --quiet; then
            git commit -m "Freeze 1LHAASO original bytes and counterpart catalogue extracts"
          fi
          git add "$base/receipts.json" "$base/run_status.json" "$base/source_class_controls.csv" "$base/class_census.csv" "$base/strict_dark.csv"
          if ! git diff --cached --quiet; then
            git commit -m "Publish catalogue provenance and latitude-matched source class controls"
          fi
          git add "$base/candidate_pairs.csv" "$base/summary.json" "$base/referee.json" "$base/REPORT.md"
          if ! git diff --cached --quiet; then
            git commit -m "Publish evaluated candidate pairs, energetic screen and referee conclusion"
          fi
          git pull --rebase origin research/lhaaso-dark-counterparts
          git push origin HEAD:research/lhaaso-dark-counterparts
