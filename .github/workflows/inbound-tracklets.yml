name: Rubin ITF search
on:
  push:
    branches: [research/inbound-hyperbolic-search]
    paths:
      - ".github/workflows/inbound-tracklets.yml"
      - "results/inbound-hyperbolic-search/tracklets/*.py"
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: results/inbound-hyperbolic-search/tracklets
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select Rubin observations from the current ITF
        run: python results/inbound-hyperbolic-search/tracklets/extract.py --output run
      - name: Link observations and measure forced-track recovery
        if: hashFiles('results/inbound-hyperbolic-search/tracklets/link.py') != ''
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 pyerfa==2.0.1.5
          python results/inbound-hyperbolic-search/tracklets/link.py --data run --trials 100
          python results/inbound-hyperbolic-search/tracklets/link.py --data run --survey F51 --trials 100
      - name: Export the small reproducibility bundle
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          for p in sorted(Path("run").glob("*")):
              encoded = base64.b64encode(gzip.compress(p.read_bytes(), mtime=0)).decode("ascii")
              for index in range(0, len(encoded), 3000):
                  print(f"PUBLIC_DATA {p.name} {index//3000} {encoded[index:index+3000]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rubin-itf
          path: run/
          retention-days: 14
