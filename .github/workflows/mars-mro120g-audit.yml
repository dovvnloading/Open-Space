name: "Mars MRO120G independent PDS model audit"
on:
  push:
    branches: ["research/mars-2026-gravity-model-audit"]
    paths:
      - "results/mars-gravity-mro120g-2026/analyze.py"
      - "results/mars-gravity-mro120g-2026/test_analyze.py"
      - ".github/workflows/mars-mro120g-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify synthetic yaw, SHADR parser and label controls
        run: python -m unittest discover -s results/mars-gravity-mro120g-2026 -p test_analyze.py -v
      - name: Independently acquire and validate NASA PDS 2020 and 2026 full gravity models
        run: |
          python results/mars-gravity-mro120g-2026/analyze.py \
            --cache "$RUNNER_TEMP/pds-mars-gravity" \
            --output results/mars-gravity-mro120g-2026/source-model-comparison.json
      - name: Upload reviewable model comparison and receipt
        uses: actions/upload-artifact@v4
        with:
          name: mars-mro120g-archive-audit
          path: results/mars-gravity-mro120g-2026/source-model-comparison.json
          if-no-files-found: error
      - name: Push fully computed source receipt to research branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add results/mars-gravity-mro120g-2026/source-model-comparison.json
          if ! git diff --cached --quiet; then
            git commit -m "data: reproduce NASA PDS MRO120G vs MRO120F full-field audit"
            git push origin HEAD:research/mars-2026-gravity-model-audit
          fi
